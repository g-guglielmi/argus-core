# Installed by setup-core.sh as /etc/systemd/system/postgresql@.service.d/argus-size-zabbix.conf:
# every PostgreSQL instance starts after the Argus sizing unit (argus-size-zabbix.service), which
# writes the connection limit and runs timescaledb-tune for this machine before the database is up.
# Debian starts the instances through the postgresql.service umbrella, and a Before= on that unit
# alone would not order the instances themselves.
[Unit]
After=argus-size-zabbix.service
