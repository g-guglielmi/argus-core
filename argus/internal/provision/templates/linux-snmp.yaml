zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: b0123beba96045ada8542647604ac6ca
      name: Templates/Argus
  templates:
    - uuid: d1f0580b0bea4b319a761b0e495589f3
      template: 'Argus Linux by SNMP'
      name: 'Argus Linux by SNMP'
      description: |
        Generic Linux over SNMP (UCD-SNMP-MIB + HOST-RESOURCES-MIB): CPU utilization, memory use
        and uptime, with thresholds as user macros. Needs snmpd exposing the UCD + host-resources
        modules. Filesystem and interface discovery (LLD) are added in a follow-up. DESIGN section 5.
      groups:
        - name: Templates/Argus
      items:
        - uuid: 82314225081042d693f5a3521fd0fc38
          name: 'CPU idle'
          type: SNMP_AGENT
          snmp_oid: '.1.3.6.1.4.1.2021.11.11.0'
          key: 'system.cpu.idle[snmp]'
          delay: 1m
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: '%'
          description: 'UCD-SNMP ssCpuIdle: percentage of CPU time idle (feeds CPU utilization).'
        - uuid: 9065fb3b100145648c9418f5dcd64f65
          name: 'CPU utilization'
          type: CALCULATED
          key: 'system.cpu.util[snmp]'
          params: '100-last(//system.cpu.idle[snmp])'
          delay: 1m
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: 674010d8c3a74449a3f84740eb6018b2
              expression: 'min(/Argus Linux by SNMP/system.cpu.util[snmp],#3)>={$CPU.UTIL.WARN} and min(/Argus Linux by SNMP/system.cpu.util[snmp],#3)<{$CPU.UTIL.HIGH}'
              name: 'High CPU utilization'
              priority: WARNING
              description: 'CPU utilization at/above the warning threshold on the last 3 checks.'
            - uuid: cb80958726c44574ac0ea6b93c8fa801
              expression: 'min(/Argus Linux by SNMP/system.cpu.util[snmp],#3)>={$CPU.UTIL.HIGH}'
              name: 'Very high CPU utilization'
              priority: HIGH
              description: 'CPU utilization at/above the high threshold on the last 3 checks.'
        - uuid: 36d1419085414e5bada09c21b1d914e9
          name: 'Total memory'
          type: SNMP_AGENT
          snmp_oid: '.1.3.6.1.4.1.2021.4.5.0'
          key: 'vm.memory.size[total]'
          delay: 5m
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: B
          description: 'UCD-SNMP memTotalReal (KB), scaled to bytes.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
        - uuid: dc9a09bf8b68438592353cd798fe956d
          name: 'Available memory'
          type: SNMP_AGENT
          snmp_oid: '.1.3.6.1.4.1.2021.4.6.0'
          key: 'vm.memory.size[available]'
          delay: 1m
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: B
          description: 'UCD-SNMP memAvailReal (KB), scaled to bytes.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
        - uuid: 01edcc1dad1b4799a3be05e398b8afc5
          name: 'Memory utilization'
          type: CALCULATED
          key: 'vm.memory.utilization[snmp]'
          params: '100*(last(//vm.memory.size[total])-last(//vm.memory.size[available]))/last(//vm.memory.size[total])'
          delay: 1m
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: 44ec860e6a6b4d55b69d87ced935811b
              expression: 'min(/Argus Linux by SNMP/vm.memory.utilization[snmp],#3)>={$MEM.USED.WARN} and min(/Argus Linux by SNMP/vm.memory.utilization[snmp],#3)<{$MEM.USED.HIGH}'
              name: 'High memory utilization'
              priority: WARNING
              description: 'Memory use at/above the warning threshold on the last 3 checks.'
            - uuid: 7ea18238f2664652b939b1ac4cda76cb
              expression: 'min(/Argus Linux by SNMP/vm.memory.utilization[snmp],#3)>={$MEM.USED.HIGH}'
              name: 'Very high memory utilization'
              priority: HIGH
              description: 'Memory use at/above the high threshold on the last 3 checks.'
        - uuid: 7ce217f526164cc680eccb21fc023d0c
          name: 'Uptime'
          type: SNMP_AGENT
          snmp_oid: '.1.3.6.1.2.1.25.1.1.0'
          key: 'system.uptime[snmp]'
          delay: 1m
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: uptime
          description: 'HOST-RESOURCES hrSystemUptime in TimeTicks (1/100 s), scaled to seconds.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
      discovery_rules:
        - uuid: e898b32bb4b94486a40ef37d0d4b5bf4
          name: 'Filesystem discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#FSNAME},1.3.6.1.2.1.25.2.3.1.3,{#FSTYPE},1.3.6.1.2.1.25.2.3.1.2]'
          key: 'vfs.fs.discovery[snmp]'
          delay: 1h
          description: 'HOST-RESOURCES hrStorageTable, filtered to fixed disks.'
          filter:
            evaltype: AND
            conditions:
              # Keep fixed disks whether the proxy reports the type numerically (…25.2.1.4) or
              # symbolically (HOST-RESOURCES-TYPES::hrStorageFixedDisk, when MIBs are loaded).
              - macro: '{#FSTYPE}'
                value: 'FixedDisk$|25\.2\.1\.4$'
                operator: MATCHES_REGEX
                formulaid: A
              # Drop pseudo-/tmpfs mounts that systemd reports as fixed disks (/run, /dev/shm, …).
              - macro: '{#FSNAME}'
                value: '{$FS.NAME.SKIP}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          item_prototypes:
            - uuid: e4560e9356ef446a9170d983a55cfb8b
              name: 'Storage allocation units ({#FSNAME})'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.25.2.3.1.4.{#SNMPINDEX}'
              key: 'snmp.storage.units[{#SNMPINDEX}]'
              delay: 1h
              history: 7d
              trends: '0'
              value_type: FLOAT
              description: 'hrStorageAllocationUnits: block size in bytes (feeds the byte totals).'
            - uuid: d15ac8f42eb2481ab41ecd42ca8e8ef3
              name: 'Storage size in blocks ({#FSNAME})'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.25.2.3.1.5.{#SNMPINDEX}'
              key: 'snmp.storage.size[{#SNMPINDEX}]'
              delay: 1h
              history: 7d
              trends: '0'
              value_type: FLOAT
            - uuid: e0eddc2e6cbf4331af907962ead5f64e
              name: 'Storage used in blocks ({#FSNAME})'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.25.2.3.1.6.{#SNMPINDEX}'
              key: 'snmp.storage.used[{#SNMPINDEX}]'
              delay: 5m
              history: 7d
              trends: '0'
              value_type: FLOAT
            - uuid: 135bdc90477e427797b662724cff1382
              name: 'Disk total ({#FSNAME})'
              type: CALCULATED
              key: 'vfs.fs.size[{#FSNAME},total]'
              params: 'last(//snmp.storage.size[{#SNMPINDEX}])*last(//snmp.storage.units[{#SNMPINDEX}])'
              delay: 5m
              history: 7d
              trends: 365d
              value_type: FLOAT
              units: B
            - uuid: 4ce100fce3894caaad2dec17f2280817
              name: 'Disk used ({#FSNAME})'
              type: CALCULATED
              key: 'vfs.fs.size[{#FSNAME},used]'
              params: 'last(//snmp.storage.used[{#SNMPINDEX}])*last(//snmp.storage.units[{#SNMPINDEX}])'
              delay: 5m
              history: 7d
              trends: 365d
              value_type: FLOAT
              units: B
            - uuid: d4d1a26f750c4cc29e5154f1055a5b57
              name: 'Disk used percent ({#FSNAME})'
              type: CALCULATED
              key: 'vfs.fs.size[{#FSNAME},pused]'
              params: '100*last(//snmp.storage.used[{#SNMPINDEX}])/last(//snmp.storage.size[{#SNMPINDEX}])'
              delay: 5m
              history: 7d
              trends: 365d
              value_type: FLOAT
              units: '%'
              trigger_prototypes:
                - uuid: f55a56a47fd944359c9b9b20f9c8931a
                  expression: 'min(/Argus Linux by SNMP/vfs.fs.size[{#FSNAME},pused],#3)>={$DISK.PUSED.WARN} and min(/Argus Linux by SNMP/vfs.fs.size[{#FSNAME},pused],#3)<{$DISK.PUSED.HIGH}'
                  name: 'Disk space low: {#FSNAME}'
                  priority: WARNING
                  description: 'Filesystem usage at/above the warning threshold.'
                - uuid: 570ef8d5c45a4f2184c17de4e8a7b350
                  expression: 'min(/Argus Linux by SNMP/vfs.fs.size[{#FSNAME},pused],#3)>={$DISK.PUSED.HIGH}'
                  name: 'Disk space critical: {#FSNAME}'
                  priority: HIGH
                  description: 'Filesystem usage at/above the high threshold.'
        - uuid: 9372f862ad054df38bfa1a0f9c82ddee
          name: 'Network interface discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18]'
          key: 'net.if.discovery[snmp]'
          delay: 1h
          description: 'IF-MIB ifXTable, filtered to physical interfaces.'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFNAME}'
                value: '{$NET.IF.SKIP}'
                operator: NOT_MATCHES_REGEX
                formulaid: A
          item_prototypes:
            - uuid: cd2220b5eb0c46d4aed19f4b78bad0be
              name: 'Traffic in ({#IFNAME})'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
              key: 'net.if.in[{#IFNAME}]'
              delay: 1m
              history: 7d
              trends: 365d
              value_type: FLOAT
              units: bps
              description: 'ifHCInOctets as a bit rate.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
            - uuid: d87cd86d966a429b8d24103d00fc50cb
              name: 'Traffic out ({#IFNAME})'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
              key: 'net.if.out[{#IFNAME}]'
              delay: 1m
              history: 7d
              trends: 365d
              value_type: FLOAT
              units: bps
              description: 'ifHCOutOctets as a bit rate.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
      macros:
        - macro: '{$CPU.UTIL.WARN}'
          value: '80'
          description: 'CPU utilization percentage that raises a warning.'
        - macro: '{$CPU.UTIL.HIGH}'
          value: '95'
          description: 'CPU utilization percentage that raises a high-severity alert.'
        - macro: '{$MEM.USED.WARN}'
          value: '85'
          description: 'Memory-used percentage that raises a warning.'
        - macro: '{$MEM.USED.HIGH}'
          value: '95'
          description: 'Memory-used percentage that raises a high-severity alert.'
        - macro: '{$DISK.PUSED.WARN}'
          value: '90'
          description: 'Filesystem used percentage that raises a warning (10% free).'
        - macro: '{$DISK.PUSED.HIGH}'
          value: '95'
          description: 'Filesystem used percentage that raises a high-severity alert (5% free).'
        - macro: '{$FS.NAME.SKIP}'
          value: '^(/run|/dev|/sys|/proc)($|/)'
          description: 'Mount paths matching this regex are not discovered (tmpfs / pseudo-filesystems).'
        - macro: '{$NET.IF.SKIP}'
          value: '^(lo$|veth|docker|br-|virbr|vnet|tap|tun|cali|cni|flannel|dummy)'
          description: 'Interface names matching this regex are not discovered (virtual / container NICs).'
