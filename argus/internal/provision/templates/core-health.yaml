        - uuid: 7203f1d4f4fd4a01b80a5a66e14896dd
          name: 'Core unsupported items'
          type: INTERNAL
          key: 'zabbix[items_unsupported]'
          delay: 1m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          description: 'Items that cannot be read right now, across every host: each is a sensor Argus shows with why.'
          triggers:
            - uuid: 7ca83dc387a4443d984b98349b892f78
              expression: 'min(/Argus Core Health/zabbix[items_unsupported],15m)>={$CORE.UNSUPPORTED.WARN} and min(/Argus Core Health/zabbix[items_unsupported],15m)<{$CORE.UNSUPPORTED.HIGH}'
