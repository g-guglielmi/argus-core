              name: 'Core configuration cache filling up'
              tags:
                - tag: argus.recovery
                  value: 'Core configuration cache back to normal'
              priority: WARNING
              description: 'The configuration cache (hosts, items, triggers) stayed at or above the warning threshold for 5 minutes (below the high threshold). Give the VM more RAM: it re-sizes itself at boot.'
            - uuid: 6779b2bcc9fa47c5aa2a6637f60ed958
              expression: 'min(/Argus Core Health/zabbix[rcache,buffer,pused],5m)>={$CORE.CACHE.HIGH}'
