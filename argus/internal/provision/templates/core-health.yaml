zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: b0123beba96045ada8542647604ac6ca
      name: Templates/Argus
  templates:
    - uuid: a7cec4c0412c491691f66a85da33c784
      template: 'Argus Core Health'
      name: 'Argus Core Health'
      description: |
        Health and capacity of the Argus core, measured by the Zabbix server itself: internal checks on
        the server's own host ("Zabbix server"), which Argus adopts at startup in place of Zabbix's stock
        server health template. The sensors are the figures the sizing pass (DESIGN 14b) is built on:
        required performance and values per second against the pass's design point, the caches (more RAM
        when full), the processes (more cores when busy), hosts, items, unsupported and delayed items. The
        VM re-sizes Zabbix to its RAM and cores at every boot (argus-size-zabbix). Thresholds are user
        macros, editable in the Argus Thresholds screen. Items are named "Core ..." so Argus files them
        under Core.
      groups:
        - name: Templates/Argus
      items:
        - uuid: 4539be13a80d4c34afc9fe5bca572a8a
          name: 'Core required performance'
          type: INTERNAL
          key: 'zabbix[requiredperformance]'
          delay: 1m
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: 'vps'
          description: 'Zabbix''s own estimate of the values per second it must collect for the items it has: the figure the sizing pass sizes the core for. More than the design point means the fleet outgrew the sizing: redo the pass.'
          triggers:
            - uuid: ae240cd3d5d644b7933b9c416a2d683f
              expression: 'min(/Argus Core Health/zabbix[requiredperformance],10m)>={$CORE.VPS.WARN} and min(/Argus Core Health/zabbix[requiredperformance],10m)<{$CORE.VPS.HIGH}'
              name: 'Core load above the sizing warning'
              tags:
                - tag: argus.recovery
                  value: 'Core load back within the sizing'
              priority: WARNING
              description: 'The required performance stayed at or above the warning threshold for 10 minutes (below the high threshold): the fleet is approaching what the core was sized for.'
            - uuid: 258abe4b91fa46e9be1e5857d2001604
              expression: 'min(/Argus Core Health/zabbix[requiredperformance],10m)>={$CORE.VPS.HIGH}'
              name: 'Core load above the sizing design point'
              tags:
                - tag: argus.recovery
                  value: 'Core load back within the sizing'
              priority: HIGH
              description: 'The required performance stayed at or above the high threshold for 10 minutes: the fleet has outgrown the sizing. Redo the sizing pass, then grow the VM.'
        - uuid: 657df94aed3743de93b5b7630c0bb6e9
          name: 'Core values processed per second'
          type: INTERNAL
          key: 'zabbix[wcache,values,all]'
          delay: 1m
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: 'vps'
          description: 'Values the server actually processed per second, all types together (polled and dependent items alike).'
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          triggers:
            - uuid: 8f1e2369cfa94cac81eb274ceed01f20
              expression: 'min(/Argus Core Health/zabbix[wcache,values,all],10m)>={$CORE.VPS.WARN} and min(/Argus Core Health/zabbix[wcache,values,all],10m)<{$CORE.VPS.HIGH}'
              name: 'Core processing above the sizing warning'
              tags:
                - tag: argus.recovery
                  value: 'Core processing back within the sizing'
              priority: WARNING
              description: 'Values processed per second stayed at or above the warning threshold for 10 minutes (below the high threshold).'
            - uuid: 5989ede9ef7a45d2a8fa2658e4a52a4f
              expression: 'min(/Argus Core Health/zabbix[wcache,values,all],10m)>={$CORE.VPS.HIGH}'
              name: 'Core processing above the sizing design point'
              tags:
                - tag: argus.recovery
                  value: 'Core processing back within the sizing'
              priority: HIGH
              description: 'Values processed per second stayed at or above the high threshold for 10 minutes: more than the core was sized for. Redo the sizing pass, then grow the VM.'
        - uuid: 586041112bc24d938cceff7f7b95aa19
          name: 'Core values written per second'
          type: INTERNAL
          key: 'zabbix[vps,written]'
          delay: 1m
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: 'vps'
          description: 'History values written to the database per second: what the database and its disk carry.'
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          triggers:
            - uuid: abd49d2df6834080ae7fbf803b80a10c
              expression: 'min(/Argus Core Health/zabbix[vps,written],10m)>={$CORE.WRITTEN.WARN} and min(/Argus Core Health/zabbix[vps,written],10m)<{$CORE.WRITTEN.HIGH}'
              name: 'Core database writes above the sizing warning'
              tags:
                - tag: argus.recovery
                  value: 'Core database writes back within the sizing'
              priority: WARNING
              description: 'Values written per second stayed at or above the warning threshold for 10 minutes (below the high threshold).'
            - uuid: 5ae3c4c7916241158ba7ad1025159234
              expression: 'min(/Argus Core Health/zabbix[vps,written],10m)>={$CORE.WRITTEN.HIGH}'
