        - uuid: 346d002500b44263bca73e6c4be3e828
          name: 'Core headroom: items'
          type: CALCULATED
          key: 'argus.core.headroom[items]'
          delay: 1h
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: '!days'
          params: 'timeleft(//zabbix[items],30d,{$CORE.ITEMS.HIGH})'
          description: 'Days until the monitored items reach their high threshold, at the last 30 days'' trend (a linear fit of this host''s items count). 36500 means the trend never gets there.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var s = parseFloat(value);
                  if (!(s >= 0)) throw 'not enough readings yet to forecast (it needs a day of data)';
                  if (s > 3153600000) return 36500;
                  return Math.round(s / 8640) / 10;
          triggers:
            - uuid: f8d647763c014e1ea68b6f4f80c2d346
              expression: 'last(/Argus Core Health/argus.core.headroom[items])<{$CORE.HEADROOM.WARN} and last(/Argus Core Health/argus.core.headroom[items])>={$CORE.HEADROOM.HIGH}'
              name: 'Core items headroom shrinking'
              tags:
                - tag: argus.recovery
                  value: 'Core items headroom back'
              priority: WARNING
              description: 'At the last 30 days'' trend, items reach their limit in fewer days than the warning threshold (more than the high one). Plan the next sizing step.'
            - uuid: 34ada9fe8aa34e45ba4e35cb6e3284e4
              expression: 'last(/Argus Core Health/argus.core.headroom[items])<{$CORE.HEADROOM.HIGH}'
              name: 'Core items headroom nearly gone'
              tags:
                - tag: argus.recovery
                  value: 'Core items headroom back'
              priority: HIGH
              description: 'At the last 30 days'' trend, items reach their limit in fewer days than the high threshold. Act now: redo the sizing pass and grow the VM.'
