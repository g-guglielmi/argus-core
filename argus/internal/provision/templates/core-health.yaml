              tags:
                - tag: argus.recovery
                  value: 'Core sensors reading again'
              priority: WARNING
              description: 'Unsupported items stayed at or above the warning threshold for 15 minutes (below the high threshold): a class, a credential or a device family is failing across hosts.'
            - uuid: 39e56194e36d44c5ac91d3ee16b10297
