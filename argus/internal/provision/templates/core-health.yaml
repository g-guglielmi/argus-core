          type: INTERNAL
          key: 'zabbix[queue,10m]'
          delay: 1m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          description: 'Items whose next reading is more than 10 minutes overdue, across the server and its probes. A growing number means the core or a probe cannot keep up.'
