      macros:
        - macro: '{$XCP.USER}'
          value: root
          description: 'XAPI username. XCP-NG local XAPI accounts are root-only, so this is root unless the pool uses external (AD) authentication.'
        - macro: '{$XCP.PASS}'
          value: ''
          description: 'XAPI password (the host root password). Set per host as a secret macro.'
        - macro: '{$XCP.VM.MODE}'
          value: 'off'
          description: 'Per-VM monitoring: off (pool/hypervisor sensors only), state (adds each VM''s power state), or full (adds per-VM CPU, memory, disk I/O and network I/O).'
        - macro: '{$XCP.VM.IGNORE}'
          value: ''
          description: 'Comma-separated VM names to leave out of monitoring entirely (parked templates, scratch VMs) - they disappear from the per-VM sensors and the running/defined counts. Argus host settings edits this as a checklist.'
        - macro: '{$XCP.CPU.UTIL.WARN}'
          value: '85'
          description: 'Hypervisor CPU utilization (%) that raises a warning (5-minute average).'
        - macro: '{$XCP.CPU.UTIL.HIGH}'
          value: '95'
          description: 'Hypervisor CPU utilization (%) that raises a high-severity alert (5-minute average).'
        - macro: '{$XCP.MEM.WARN}'
          value: '85'
          description: 'Hypervisor memory usage (%) that raises a warning (5-minute average).'
        - macro: '{$XCP.MEM.HIGH}'
          value: '95'
          description: 'Hypervisor memory usage (%) that raises a high-severity alert (5-minute average).'
        - macro: '{$XCP.TEMP.WARN}'
          value: '80'
          description: 'CPU package temperature (C) at or above which the running-hot warning fires (needs the argus-temp dom0 plugin).'
        - macro: '{$XCP.TEMP.HIGH}'
          value: '90'
          description: 'CPU package temperature (C) at or above which the overheating alert fires (needs the argus-temp dom0 plugin).'
