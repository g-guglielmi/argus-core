zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: b0123beba96045ada8542647604ac6ca
      name: Templates/Argus
  templates:
    - uuid: d348dcdd5e7a40138251e035ddeac174
      template: 'Argus Linux by SSH'
      name: 'Argus Linux by SSH'
      description: |
        The agentless, no-SNMP fallback for a Linux box you can only reach over SSH. The proxy runs a
        small collector (argus_linux_ssh.py, an external check baked into the argus-probe image) that
        opens ONE SSH session per poll, reads /proc + df + /proc/net/dev, and prints CPU utilisation
        (plus iowait and steal), load average, memory, uptime, failed systemd units, per-filesystem
        usage and per-interface traffic (the last two via LLD) as JSON - so every reading comes from a single login instead of one connection per item.
        Item keys match the native agent/SNMP keys, so a host reads the same whichever way it is
        monitored. Set {$SSH.USER} to a read-only login, {$SSH.AUTH} to "key" (recommended) or
        "password", and either {$SSH.KEYFILE} (path to the private key ON the proxy) or {$SSH.PASSWORD}
        (secret). The host's own interface is the Linux box's IP (Base Ping + the collector run against
        it). DESIGN section 5.
      groups:
        - name: Templates/Argus
      items:
        - uuid: de0852df5f4642b18e0591a5be794e3b
          name: 'Linux SSH raw data'
          type: EXTERNAL
          key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
          delay: 1m
          history: '0'
          trends: '0'
          value_type: TEXT
          timeout: 30s
          description: 'Master item: the proxy''s argus_linux_ssh.py collector logs in once, reads /proc + df + /proc/net/dev and prints every reading as JSON. An SSH/auth/parse failure prints reachable=0 (not an error) so the down trigger fires instead of the items going unsupported.'
        - uuid: 1fff703174b44c32b1c5b7c236d9db1e
          name: 'Collection error'
          type: DEPENDENT
          key: linux.ssh.error
          delay: '0'
          history: 7d
          trends: '0'
          value_type: TEXT
          description: 'Why the last poll failed, in one line (empty while it works). Not a curated sensor: Argus shows it next to the down reading and in the alert.'
          master_item:
            key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.error'
              error_handler: CUSTOM_VALUE
              error_handler_params: ''
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: 6aeb8117b4a84ad8be40517eb7fc17c0
          name: 'Monitoring reachable'
          type: DEPENDENT
          key: linux.ssh.reachable
          delay: '0'
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          description: '1 = the SSH poll completed, 0 = the host is unreachable or the login failed. Not a curated sensor - it drives the down trigger.'
          master_item:
            key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.reachable'
          triggers:
            - uuid: 60355bb838b142d9a56b5e8dce95b1fd
              expression: 'max(/Argus Linux by SSH/linux.ssh.reachable,#3)=0'
              name: 'SSH monitoring is unreachable'
              priority: HIGH
              description: 'The SSH collector has not completed a poll on the last 3 checks (host down, SSH refused, or the login/key is wrong).'
        - uuid: bfa8719a8f284e29909b5e7091f55f2f
          name: 'CPU utilization'
          type: DEPENDENT
          key: 'system.cpu.util[ssh]'
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: '%'
          description: 'Overall CPU utilization, computed from two /proc/stat samples one second apart (100 - idle%).'
          master_item:
            key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.cpu_util'
              error_handler: DISCARD_VALUE
          triggers:
            - uuid: 08e77a7599c2408e9c16e810af1db841
              expression: 'min(/Argus Linux by SSH/system.cpu.util[ssh],#3)>={$CPU.UTIL.WARN} and min(/Argus Linux by SSH/system.cpu.util[ssh],#3)<{$CPU.UTIL.HIGH}'
              name: 'High CPU utilization'
              priority: WARNING
              description: 'CPU utilization at/above the warning threshold on the last 3 checks.'
            - uuid: 9c173a6590a946ff8cf685d8c5d284b7
              expression: 'min(/Argus Linux by SSH/system.cpu.util[ssh],#3)>={$CPU.UTIL.HIGH}'
              name: 'Very high CPU utilization'
              priority: HIGH
              description: 'CPU utilization at/above the high threshold on the last 3 checks.'
        - uuid: 578ed2f66db648909a4fd5b518da6c9f
          name: 'CPU iowait'
          type: DEPENDENT
          key: 'system.cpu.util[ssh,iowait]'
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: '%'
          description: 'Share of CPU time spent idle while waiting on storage, from the same two /proc/stat samples as CPU utilization. CPU utilization counts it as idle, so a box stuck on its disks reads idle there and high here.'
          master_item:
            key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.cpu_iowait'
              error_handler: DISCARD_VALUE
          triggers:
            - uuid: 7f5c16abe9e94b36b7830f6ba798b89d
              expression: 'min(/Argus Linux by SSH/system.cpu.util[ssh,iowait],#3)>={$CPU.IOWAIT.WARN} and min(/Argus Linux by SSH/system.cpu.util[ssh,iowait],#3)<{$CPU.IOWAIT.HIGH}'
              name: 'High CPU iowait'
              priority: WARNING
              description: 'CPU iowait at/above the warning threshold on the last 3 checks: the host is waiting on its storage.'
            - uuid: 989863f439754abca83503576598a792
              expression: 'min(/Argus Linux by SSH/system.cpu.util[ssh,iowait],#3)>={$CPU.IOWAIT.HIGH}'
              name: 'Very high CPU iowait'
              priority: HIGH
              description: 'CPU iowait at/above the high threshold on the last 3 checks: the host is waiting on its storage.'
        - uuid: 8dacd9f792e34ff39a667575f7883eb7
          name: 'CPU steal'
          type: DEPENDENT
          key: 'system.cpu.util[ssh,steal]'
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: '%'
          description: 'Share of CPU time the hypervisor gave to other guests while this VM wanted to run (/proc/stat). CPU utilization counts it as busy: a high steal means the hypervisor or the VPS provider is overcommitted, not that this box is loaded. Always 0 on bare metal.'
          master_item:
            key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.cpu_steal'
              error_handler: DISCARD_VALUE
          triggers:
            - uuid: c27931dcb7864ac1b3f654a26eced458
              expression: 'min(/Argus Linux by SSH/system.cpu.util[ssh,steal],#3)>={$CPU.STEAL.WARN} and min(/Argus Linux by SSH/system.cpu.util[ssh,steal],#3)<{$CPU.STEAL.HIGH}'
              name: 'High CPU steal'
              priority: WARNING
              description: 'CPU steal at/above the warning threshold on the last 3 checks: other guests on the same hypervisor are taking this VM''s CPU time.'
            - uuid: 8eb97af8e4e64c9cad8a8db74ca910e8
              expression: 'min(/Argus Linux by SSH/system.cpu.util[ssh,steal],#3)>={$CPU.STEAL.HIGH}'
              name: 'Very high CPU steal'
              priority: HIGH
              description: 'CPU steal at/above the high threshold on the last 3 checks: other guests on the same hypervisor are taking this VM''s CPU time.'
        - uuid: b0d05050128e4e538aae3084fd0021f3
          name: 'Load average (1m)'
          type: DEPENDENT
          key: 'system.cpu.load[all,avg1]'
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          description: '1-minute load average (/proc/loadavg).'
          master_item:
            key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.load1'
              error_handler: DISCARD_VALUE
        - uuid: c3d21f9c0a504f48ba425855ef6ee53d
          name: 'Load average (5m)'
          type: DEPENDENT
          key: 'system.cpu.load[all,avg5]'
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          description: '5-minute load average (/proc/loadavg).'
          master_item:
            key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.load5'
              error_handler: DISCARD_VALUE
        - uuid: 63a2e1270cac45f5abb0c2370a98cf02
          name: 'Load average (15m)'
          type: DEPENDENT
          key: 'system.cpu.load[all,avg15]'
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          description: '15-minute load average (/proc/loadavg).'
          master_item:
            key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.load15'
              error_handler: DISCARD_VALUE
        - uuid: 6c25b3222a9c4fb7b3add7c2a320fa89
          name: 'Total memory'
          type: DEPENDENT
          key: 'vm.memory.size[total]'
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: B
          description: 'MemTotal from /proc/meminfo, in bytes.'
          master_item:
            key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.mem_total'
              error_handler: DISCARD_VALUE
        - uuid: cd408b2099af4c86a6b8ffecdb3c8be0
          name: 'Available memory'
          type: DEPENDENT
          key: 'vm.memory.size[available]'
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: B
          description: 'MemAvailable from /proc/meminfo (what applications can claim without swapping), in bytes.'
          master_item:
            key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.mem_available'
              error_handler: DISCARD_VALUE
        - uuid: 4e73001374c74d96b908e45c88ffe153
          name: 'Memory utilization'
          type: DEPENDENT
          key: 'vm.memory.utilization[ssh]'
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: '%'
          description: 'Memory in use as a percentage of total (100 * (MemTotal - MemAvailable) / MemTotal).'
          master_item:
            key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.mem_util'
              error_handler: DISCARD_VALUE
          triggers:
            - uuid: 68b389fdb8904984876bca62c4f1eb82
              expression: 'min(/Argus Linux by SSH/vm.memory.utilization[ssh],#3)>={$MEM.USED.WARN} and min(/Argus Linux by SSH/vm.memory.utilization[ssh],#3)<{$MEM.USED.HIGH}'
              name: 'High memory utilization'
              priority: WARNING
              description: 'Memory utilization at/above the warning threshold on the last 3 checks.'
            - uuid: bf47fee91ca949ea942dfd07a2ec333d
              expression: 'min(/Argus Linux by SSH/vm.memory.utilization[ssh],#3)>={$MEM.USED.HIGH}'
              name: 'Very high memory utilization'
              priority: HIGH
              description: 'Memory utilization at/above the high threshold on the last 3 checks.'
        - uuid: aa15a655797248ffa1a871e1ba092be7
          name: 'Uptime'
          type: DEPENDENT
          key: 'system.uptime[ssh]'
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: uptime
          description: 'System uptime from /proc/uptime.'
          master_item:
            key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.uptime'
              error_handler: DISCARD_VALUE
      discovery_rules:
        - uuid: 60209f5032aa47ab8769de17c4b080b5
          name: 'Service discovery'
          type: DEPENDENT
          key: linux.ssh.unit.discovery
          delay: '0'
          lifetime: 1d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'One sensor per systemd unit in {$SSH.UNITS} (a list, not real discovery: a unit the host lacks reads "not found"). A unit removed from the list is deleted after a day.'
          master_item:
            key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.unit_discovery'
              error_handler: CUSTOM_VALUE
              error_handler_params: '[]'
          item_prototypes:
            - uuid: a7cb1e1d63d64a8eb8f7827517717110
              name: 'Service {#UNIT}'
              type: DEPENDENT
              key: 'linux.ssh.unit.active[{#UNIT}]'
              delay: '0'
              history: 7d
              trends: 365d
              value_type: UNSIGNED
              description: '1 = the unit is active (systemctl), 0 = anything else: failed, inactive, restarting, not found. The state item next to it says which.'
              master_item:
                key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      if (!JSON.parse(value).reachable) { throw 'the SSH poll did not complete'; }
                      return value;
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var us = JSON.parse(value).units || [];
                      for (var i = 0; i < us.length; i++) { if (us[i].name === '{#UNIT}') { return us[i].active; } }
                      return 0;
              trigger_prototypes:
                - uuid: 4c328783beab476286579cdbeabfb39f
                  expression: 'max(/Argus Linux by SSH/linux.ssh.unit.active[{#UNIT}],#3)=0'
                  name: 'Service down: {#UNIT}'
                  priority: HIGH
                  description: 'The unit has not been active on the last 3 checks (failed, stopped, restarting, or not on this host).'
            - uuid: bff68c2bbb944fee8cee22d1bbb9d70c
              name: 'Service {#UNIT} state'
              type: DEPENDENT
              key: 'linux.ssh.unit.state[{#UNIT}]'
              delay: '0'
              history: 7d
              trends: '0'
              value_type: TEXT
              description: 'What systemctl says about the unit ("active (running)", "failed (failed), result exit-code", "not found"). Not a curated sensor: Argus shows it next to a unit that is down and in the alert.'
              master_item:
                key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      if (!JSON.parse(value).reachable) { throw 'the SSH poll did not complete'; }
                      return value;
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var us = JSON.parse(value).units || [];
                      for (var i = 0; i < us.length; i++) { if (us[i].name === '{#UNIT}') { return us[i].state; } }
                      return 'not reported';
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
        - uuid: eeec982042134639a72a2845b8e0aa05
          name: 'Container discovery'
          type: DEPENDENT
          key: linux.ssh.container.discovery
          delay: '0'
          lifetime: 1d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Docker containers (docker ps -a) whose name matches {$SSH.CONTAINERS}; empty = none. A container that disappears reads "not listed" until it is deleted a day later.'
          master_item:
            key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.container_discovery'
              error_handler: CUSTOM_VALUE
              error_handler_params: '[]'
          item_prototypes:
            - uuid: 7fece1b4dc1a44b58042538ef97366f8
              name: 'Container {#CONTAINER}'
              type: DEPENDENT
              key: 'linux.ssh.container.running[{#CONTAINER}]'
              delay: '0'
              history: 7d
              trends: 365d
              value_type: UNSIGNED
              description: '1 = the container is up (and healthy, when it has a healthcheck), 0 = exited, restarting, paused, unhealthy or gone. When docker ps itself fails the item is not supported, with docker''s reason.'
              master_item:
                key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      if (!JSON.parse(value).reachable) { throw 'the SSH poll did not complete'; }
                      return value;
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      if (d.docker_error) { throw d.docker_error; }
                      var cs = d.containers || [];
                      for (var i = 0; i < cs.length; i++) { if (cs[i].name === '{#CONTAINER}') { return cs[i].running; } }
                      return 0;
              trigger_prototypes:
                - uuid: 76b99fe5fca64b2cbfddb43241cd8be2
                  expression: 'max(/Argus Linux by SSH/linux.ssh.container.running[{#CONTAINER}],#3)=0'
                  name: 'Container down: {#CONTAINER}'
                  priority: HIGH
                  description: 'The container has not been up and healthy on the last 3 checks (exited, restarting, paused, unhealthy, or removed).'
            - uuid: 12575228849144728b0a3e2842dc5544
              name: 'Container {#CONTAINER} status'
              type: DEPENDENT
              key: 'linux.ssh.container.status[{#CONTAINER}]'
              delay: '0'
              history: 7d
              trends: '0'
              value_type: TEXT
              description: 'docker ps status ("Up 3 hours", "Exited (1) 2 hours ago", "Up 5 minutes (unhealthy)"). Not a curated sensor: Argus shows it next to a container that is down and in the alert.'
              master_item:
                key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      if (!JSON.parse(value).reachable) { throw 'the SSH poll did not complete'; }
                      return value;
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      if (d.docker_error) { return d.docker_error; }
                      var cs = d.containers || [];
                      for (var i = 0; i < cs.length; i++) { if (cs[i].name === '{#CONTAINER}') { return cs[i].status; } }
                      return 'not listed by docker ps -a (removed?)';
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
        - uuid: 3aec46b75b2e43459b408fc3f2f00340
          name: 'systemd discovery'
          type: DEPENDENT
          key: linux.ssh.systemd.discovery
          delay: '0'
          lifetime: 1d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'One row when the host runs systemd, none otherwise, so the failed-units sensor exists only where systemd does.'
          master_item:
            key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  if (!JSON.parse(value).reachable) { throw 'the SSH poll did not complete'; }
                  return value;
              error_handler: DISCARD_VALUE
            - type: JSONPATH
              parameters:
                - '$.systemd_discovery'
              error_handler: CUSTOM_VALUE
              error_handler_params: '[]'
          item_prototypes:
            - uuid: f69c40a7bd17423f8bae095dfcfb9ea4
              name: 'Failed units'
              type: DEPENDENT
              key: 'linux.ssh.units.failed[{#SYSTEMD}]'
              delay: '0'
              history: 7d
              trends: 365d
              value_type: UNSIGNED
              description: 'How many units systemd reports failed (systemctl list-units --state=failed: services, timers, mounts, any unit, listed in Services or not). No privileges needed. Their names are the reason Argus shows. When systemctl itself fails the item is not supported, with its reason.'
              master_item:
                key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      if (!JSON.parse(value).reachable) { throw 'the SSH poll did not complete'; }
                      return value;
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      if (d.failed_error) { throw d.failed_error; }
                      if (d.failed_units === null || d.failed_units === undefined) { throw 'systemctl gave no answer'; }
                      return d.failed_units;
              trigger_prototypes:
                - uuid: b2f64a5f276441c38d7f26067fdff69b
                  expression: 'min(/Argus Linux by SSH/linux.ssh.units.failed[{#SYSTEMD}],#3)>={$SSH.FAILED.WARN} and min(/Argus Linux by SSH/linux.ssh.units.failed[{#SYSTEMD}],#3)<{$SSH.FAILED.HIGH}'
                  name: 'Failed systemd units'
                  priority: WARNING
                  description: 'At least the warning number of systemd units has been failed on the last 3 checks. Their names are in the sensor''s reason.'
                - uuid: cc53c01804274722aa681332ae54ce25
                  expression: 'min(/Argus Linux by SSH/linux.ssh.units.failed[{#SYSTEMD}],#3)>={$SSH.FAILED.HIGH}'
                  name: 'Many failed systemd units'
                  priority: HIGH
                  description: 'At least the high number of systemd units has been failed on the last 3 checks. Their names are in the sensor''s reason.'
            - uuid: 5ea5f72c3c1f4922badba51029469e5e
              name: 'Failed unit names'
              type: DEPENDENT
              key: 'linux.ssh.units.failed.names[{#SYSTEMD}]'
              delay: '0'
              history: 7d
              trends: '0'
              value_type: TEXT
              description: 'The failed units by name ("backup.service, certbot.timer"), empty when none. Not a curated sensor: Argus shows it next to the failed-units count and in the alert.'
              master_item:
                key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      if (!JSON.parse(value).reachable) { throw 'the SSH poll did not complete'; }
                      return value;
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      return d.failed_error || d.failed_names || '';
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
        - uuid: ec60eacf925f4888bfa8b8f60bc91fba
          name: 'Filesystem discovery'
          type: DEPENDENT
          key: 'vfs.fs.discovery[ssh]'
          delay: '0'
          lifetime: 7d
          enabled_lifetime_type: DISABLE_IMMEDIATELY
          description: 'Mounted filesystems reported by df (pseudo/temporary filesystems already dropped by the collector; {$FS.NAME.SKIP} trims further). A mount that disappears is disabled immediately and deleted after 7 days.'
          master_item:
            key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.fs_discovery'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#FSNAME}'
                value: '{$FS.NAME.SKIP}'
                operator: NOT_MATCHES_REGEX
                formulaid: A
          item_prototypes:
            - uuid: b050df72009d47789a772a965943902d
              name: 'Disk total ({#FSNAME})'
              type: DEPENDENT
              key: 'vfs.fs.size[{#FSNAME},total]'
              delay: '0'
              history: 7d
              trends: 365d
              value_type: FLOAT
              units: B
              master_item:
                key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value), fs = d.fs || [];
                      for (var i = 0; i < fs.length; i++) { if (fs[i].name === '{#FSNAME}') return fs[i].total; }
                      throw 'no {#FSNAME}';
                  error_handler: DISCARD_VALUE
            - uuid: 0b1909332e474812851df9f7b941c351
              name: 'Disk used ({#FSNAME})'
              type: DEPENDENT
              key: 'vfs.fs.size[{#FSNAME},used]'
              delay: '0'
              history: 7d
              trends: 365d
              value_type: FLOAT
              units: B
              master_item:
                key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value), fs = d.fs || [];
                      for (var i = 0; i < fs.length; i++) { if (fs[i].name === '{#FSNAME}') return fs[i].used; }
                      throw 'no {#FSNAME}';
                  error_handler: DISCARD_VALUE
            - uuid: 4aea8b0fcba24c7eb33be87d73eac9a8
              name: 'Disk used percent ({#FSNAME})'
              type: DEPENDENT
              key: 'vfs.fs.size[{#FSNAME},pused]'
              delay: '0'
              history: 7d
              trends: 365d
              value_type: FLOAT
              units: '%'
              master_item:
                key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value), fs = d.fs || [];
                      for (var i = 0; i < fs.length; i++) { if (fs[i].name === '{#FSNAME}') return fs[i].pused; }
                      throw 'no {#FSNAME}';
                  error_handler: DISCARD_VALUE
              trigger_prototypes:
                - uuid: fff5938365af4a3baf14e01f8b8bc48c
                  expression: 'min(/Argus Linux by SSH/vfs.fs.size[{#FSNAME},pused],#3)>={$DISK.PUSED.WARN} and min(/Argus Linux by SSH/vfs.fs.size[{#FSNAME},pused],#3)<{$DISK.PUSED.HIGH}'
                  name: 'Disk space low: {#FSNAME}'
                  priority: WARNING
                  description: 'Filesystem usage at/above the warning threshold.'
                - uuid: 84f13a2c6d154cadb3ff744896de6384
                  expression: 'min(/Argus Linux by SSH/vfs.fs.size[{#FSNAME},pused],#3)>={$DISK.PUSED.HIGH}'
                  name: 'Disk space critical: {#FSNAME}'
                  priority: HIGH
                  description: 'Filesystem usage at/above the high threshold.'
        - uuid: 0b110777a32248b39676b7a04fa58f34
          name: 'Network interface discovery'
          type: DEPENDENT
          key: 'net.if.discovery[ssh]'
          delay: '0'
          lifetime: 7d
          enabled_lifetime_type: DISABLE_IMMEDIATELY
          description: 'Network interfaces from /proc/net/dev (loopback dropped by the collector; {$NET.IF.SKIP} trims virtual / container NICs). An interface that disappears is disabled immediately and deleted after 7 days.'
          master_item:
            key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.net_discovery'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFNAME}'
                value: '{$NET.IF.SKIP}'
                operator: NOT_MATCHES_REGEX
                formulaid: A
          item_prototypes:
            - uuid: 22b5374f7ed04ced995df2765f866db6
              name: 'Traffic in ({#IFNAME})'
              type: DEPENDENT
              key: 'net.if.in[{#IFNAME}]'
              delay: '0'
              history: 7d
              trends: 365d
              value_type: FLOAT
              units: bps
              description: 'Receive octets from /proc/net/dev as a bit rate.'
              master_item:
                key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value), n = d.net || [];
                      for (var i = 0; i < n.length; i++) { if (n[i].name === '{#IFNAME}') return n[i].in; }
                      throw 'no {#IFNAME}';
                  error_handler: DISCARD_VALUE
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
            - uuid: b0c4edba175c48b28d94602ed538e17a
              name: 'Traffic out ({#IFNAME})'
              type: DEPENDENT
              key: 'net.if.out[{#IFNAME}]'
              delay: '0'
              history: 7d
              trends: 365d
              value_type: FLOAT
              units: bps
              description: 'Transmit octets from /proc/net/dev as a bit rate.'
              master_item:
                key: 'argus_linux_ssh.py[{HOST.CONN},{$SSH.USER},{$SSH.PORT},{$SSH.AUTH},{$SSH.PASSWORD},{$SSH.KEYFILE},{$SSH.UNITS},{$SSH.CONTAINERS}]'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value), n = d.net || [];
                      for (var i = 0; i < n.length; i++) { if (n[i].name === '{#IFNAME}') return n[i].out; }
                      throw 'no {#IFNAME}';
                  error_handler: DISCARD_VALUE
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
      macros:
        - macro: '{$SSH.USER}'
          value: root
          description: 'SSH login user. A read-only account is enough - the collector only reads /proc, df and /proc/net/dev.'
        - macro: '{$SSH.PORT}'
          value: '22'
          description: 'SSH port.'
        - macro: '{$SSH.AUTH}'
          value: key
          description: 'Authentication mode: "key" (private key on the proxy, recommended) or "password".'
        - macro: '{$SSH.PASSWORD}'
          value: ''
          description: 'SSH password, for {$SSH.AUTH}=password. Set per host as a secret macro; passed to the collector via the environment, never on the command line.'
        - macro: '{$SSH.KEYFILE}'
          value: /var/lib/zabbix/ssh/argus_id
          description: 'Path ON THE PROXY to the private key, for {$SSH.AUTH}=key. Mount your monitoring key here (its public half goes in each target''s authorized_keys).'
        - macro: '{$SSH.UNITS}'
          value: ''
          description: 'systemd units to watch, comma or space separated (nginx, jellyfin.service). Empty = none. Read with systemctl show: no privileges needed.'
        - macro: '{$SSH.CONTAINERS}'
          value: ''
          description: 'Regular expression of Docker container names to watch (^(jellyfin|immich.*)$). Empty = none. The SSH login must be allowed to run docker ps, which means the docker group (root-equivalent on that host).'
        - macro: '{$CPU.UTIL.WARN}'
          value: '80'
          description: 'CPU utilization percentage that raises a warning.'
        - macro: '{$CPU.UTIL.HIGH}'
          value: '95'
          description: 'CPU utilization percentage that raises a high-severity alert.'
        - macro: '{$CPU.IOWAIT.WARN}'
          value: '20'
          description: 'CPU iowait percentage that raises a warning.'
        - macro: '{$CPU.IOWAIT.HIGH}'
          value: '40'
          description: 'CPU iowait percentage that raises a high-severity alert.'
        - macro: '{$CPU.STEAL.WARN}'
          value: '10'
          description: 'CPU steal percentage that raises a warning (a VM losing CPU time to other guests).'
        - macro: '{$CPU.STEAL.HIGH}'
          value: '25'
          description: 'CPU steal percentage that raises a high-severity alert.'
        - macro: '{$SSH.FAILED.WARN}'
          value: '1'
          description: 'Number of failed systemd units that raises a warning.'
        - macro: '{$SSH.FAILED.HIGH}'
          value: '3'
          description: 'Number of failed systemd units that raises a high-severity alert.'
        - macro: '{$MEM.USED.WARN}'
          value: '85'
          description: 'Memory-used percentage that raises a warning.'
        - macro: '{$MEM.USED.HIGH}'
          value: '95'
          description: 'Memory-used percentage that raises a high-severity alert.'
        - macro: '{$DISK.PUSED.WARN}'
          value: '90'
          description: 'Filesystem used percentage that raises a warning (10% free).'
        - macro: '{$DISK.PUSED.HIGH}'
          value: '95'
          description: 'Filesystem used percentage that raises a high-severity alert (5% free).'
        - macro: '{$FS.NAME.SKIP}'
          value: '^(/run|/dev|/sys|/proc)($|/)'
          description: 'Mount paths matching this regex are not discovered (tmpfs / pseudo-filesystems).'
        - macro: '{$NET.IF.SKIP}'
          value: '^(lo$|veth|docker|br-|virbr|vnet|tap|tun|cali|cni|flannel|dummy)'
          description: 'Interface names matching this regex are not discovered (virtual / container NICs).'
