zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: b0123beba96045ada8542647604ac6ca
      name: Templates/Argus
  templates:
    - uuid: a9ef1c0b527a4267add896856988b401
      template: 'Argus Home Assistant by HTTP'
      name: 'Argus Home Assistant by HTTP'
      description: |
        Home Assistant polled from its REST API with a long-lived access token: whether the API is up,
        and the Core / Supervisor / Operating-system versions. This monitors the platform itself, not
        the entities it exposes (that would be thousands of items - use Home Assistant's own dashboards
        for those). Core version comes from /api/config; Supervisor + OS versions come from the hassio
        "update" entities and only appear on HA OS / Supervised installs (a Container install has
        neither). Set {$HASS.URL} to the base URL including the port (e.g. http://homeassistant.example.lan:8123)
        and {$HASS.TOKEN} to a long-lived access token (Home Assistant -> Profile -> Security -> Long-lived
        access tokens). The host's own interface is the Home Assistant box's IP (Base Ping). DESIGN section 5.
      groups:
        - name: Templates/Argus
      items:
        - uuid: 994d74774f7e478bbdf1c8b948967e1b
          name: 'Home Assistant raw data'
          type: SCRIPT
          key: hass.raw
          delay: 1m
          history: '0'
          trends: '0'
          value_type: TEXT
          timeout: 20s
          description: 'Master item: /api/ health, /api/config (core version) and the hassio update entities (supervisor + OS versions), reduced to the fields the sensors use. Unreachable or not-yet-ready returns running=0 (not an error) so the down trigger fires; only a missing URL/token or a rejected token make the item unsupported.'
          params: |
            var p = JSON.parse(value);
            if (!p.url || !p.token) { throw 'set {$HASS.URL} and {$HASS.TOKEN} on the host'; }
            var base = String(p.url).replace(/\/+$/, '');
            var out = { running: 0, core: '' };
            var req = new HttpRequest();
            req.addHeader('Authorization: Bearer ' + p.token);
            req.addHeader('Accept: application/json');
            var code;
            try { req.get(base + '/api/'); code = req.getStatus(); }
            catch (e) { return JSON.stringify(out); }
            if (code === 401 || code === 403) { throw 'Home Assistant: HTTP ' + code + ' - check {$HASS.TOKEN}'; }
            if (code !== 200) { return JSON.stringify(out); }
            out.running = 1;
            try { var cfg = JSON.parse(req.get(base + '/api/config')); out.core = cfg.version || ''; } catch (e) {}
            // Supervisor + OS versions live on the hassio "update" entities - present only on HA OS /
            // Supervised installs. Absent (Container, renamed entity) -> left out, so the row drops.
            function entver(entity) {
              if (!entity) { return ''; }
              try {
                var r = req.get(base + '/api/states/' + entity);
                if (req.getStatus() !== 200) { return ''; }
                var s = JSON.parse(r);
                return (s.attributes && s.attributes.installed_version) || '';
              } catch (e) { return ''; }
            }
            var sup = entver(p.sup_entity);
            if (sup) { out.supervisor = sup; }
            var os = entver(p.os_entity);
            if (os) { out.os = os; }
            return JSON.stringify(out);
          parameters:
            - name: url
              value: '{$HASS.URL}'
            - name: token
              value: '{$HASS.TOKEN}'
            - name: sup_entity
              value: '{$HASS.SUPERVISOR.ENTITY}'
            - name: os_entity
              value: '{$HASS.OS.ENTITY}'
        - uuid: 7d85c0df2a9548e0b0c820da712aaebf
          name: 'API running'
          type: DEPENDENT
          key: hass.running
          delay: '0'
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          description: '1 = /api/ reports the API running, 0 = Home Assistant is down, unreachable, or not ready (starting up / a gateway error in front of it). Not a curated sensor - it drives the down trigger.'
          master_item:
            key: hass.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.running'
          triggers:
            - uuid: 9ed9e27b51d144d7855c6cdbfa97ae67
              expression: 'max(/Argus Home Assistant by HTTP/hass.running,#3)=0'
              name: 'Home Assistant is down or not ready'
              priority: HIGH
              description: 'The API has not reported ready on the last 3 checks (down, unreachable, or a long restart/upgrade).'
        - uuid: ebb27bd0e7e84cd6ae05009e899eda9f
          name: 'Core version'
          type: DEPENDENT
          key: hass.version.core
          delay: '0'
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'Home Assistant Core version (from /api/config).'
          master_item:
            key: hass.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.core'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
        - uuid: f236ae9768a54cbc89f42e1d4a09661b
          name: 'Supervisor version'
          type: DEPENDENT
          key: hass.version.supervisor
          delay: '0'
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'Home Assistant Supervisor version (HA OS / Supervised installs only).'
          master_item:
            key: hass.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.supervisor'
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
        - uuid: db9a7efe19704a70b08b2029a519ac82
          name: 'OS version'
          type: DEPENDENT
          key: hass.version.os
          delay: '0'
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'Home Assistant Operating System (host) version (HA OS installs only).'
          master_item:
            key: hass.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.os'
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
      macros:
        - macro: '{$HASS.URL}'
          value: 'http://homeassistant.example.lan:8123'
          description: 'Home Assistant base URL including the port (default 8123). Set per host.'
        - macro: '{$HASS.TOKEN}'
          value: ''
          description: 'Long-lived access token (Profile -> Security). Set per host as a secret macro.'
        - macro: '{$HASS.SUPERVISOR.ENTITY}'
          value: update.home_assistant_supervisor_update
          description: 'Entity whose installed_version attribute is the Supervisor version. Override if you renamed it.'
        - macro: '{$HASS.OS.ENTITY}'
          value: update.home_assistant_operating_system_update
          description: 'Entity whose installed_version attribute is the OS version. Override if you renamed it.'
