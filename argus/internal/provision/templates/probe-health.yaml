zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: b0123beba96045ada8542647604ac6ca
      name: Templates/Argus
  templates:
    - uuid: ce281c1d863948abac98168d62565123
      template: 'Argus Probe Health'
      name: 'Argus Probe Health'
      description: |
        Health of an Argus probe (a Zabbix proxy), measured by the proxy itself: Zabbix internal
        checks run on the proxy that monitors the host, so this template goes on one "Probe <site>"
        host per proxy, monitored by that proxy and with no interface. Argus creates those hosts
        automatically. Reachability uses a strict nodata() trigger, so it fires while the proxy is
        offline too. Thresholds are user macros, editable in the Argus Thresholds screen.
      groups:
        - name: Templates/Argus
      items:
        - uuid: ae5ac0e9eecf49aabb4bd3daffcdda36
          name: 'Probe uptime'
          type: INTERNAL
          key: 'zabbix[uptime]'
          delay: 1m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          units: 'uptime'
          description: 'How long the proxy process has been running. No new value means the probe is not reaching the core.'
          triggers:
            - uuid: daaa2fab16784ff0a37e3c88f7d98156
              expression: 'nodata(/Argus Probe Health/zabbix[uptime],{$PROBE.NODATA.WARN},"strict")=1 and nodata(/Argus Probe Health/zabbix[uptime],{$PROBE.NODATA.HIGH},"strict")=0'
              name: 'Probe not reporting'
              priority: WARNING
              description: 'No data from the probe for the warning period: it is offline or cannot reach the core. It keeps collecting and buffers its data meanwhile.'
            - uuid: 0babcaf2316847f29735e6dae0508819
              expression: 'nodata(/Argus Probe Health/zabbix[uptime],{$PROBE.NODATA.HIGH},"strict")=1'
              name: 'Probe unreachable'
              priority: HIGH
              description: 'No data from the probe for the high period. Nothing from this site reaches Argus until it reconnects.'
        - uuid: 594d9682dd5746f096781b3c87defc23
          name: 'Unsent values'
          type: INTERNAL
          key: 'zabbix[proxy_history]'
          delay: 1m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          description: 'Values the proxy has collected but not yet sent to the core. Normally near zero; a growing number means data is backing up.'
          triggers:
            - uuid: 734e0df026d7404682f52f98354b5b06
              expression: 'min(/Argus Probe Health/zabbix[proxy_history],5m)>={$PROBE.BACKLOG.WARN} and min(/Argus Probe Health/zabbix[proxy_history],5m)<{$PROBE.BACKLOG.HIGH}'
              name: 'Probe data backing up'
              priority: WARNING
              description: 'Unsent values stayed at or above the warning threshold for 5 minutes (below the high threshold).'
            - uuid: d1bed9fa74994dee88744a3c6d829bc5
              expression: 'min(/Argus Probe Health/zabbix[proxy_history],5m)>={$PROBE.BACKLOG.HIGH}'
              name: 'Probe data badly backed up'
              priority: HIGH
              description: 'Unsent values stayed at or above the high threshold for 5 minutes.'
        - uuid: e8ce59ce8e5048038ced1b81293bdf83
          name: 'Delayed items (over 10 min)'
          type: INTERNAL
          key: 'zabbix[queue,10m]'
          delay: 1m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          description: 'Items the proxy is more than 10 minutes late collecting. Unreachable devices add to this too.'
          triggers:
            - uuid: 380f1bc599414ba1b2f261967c6bd8cb
              expression: 'min(/Argus Probe Health/zabbix[queue,10m],15m)>={$PROBE.QUEUE.WARN} and min(/Argus Probe Health/zabbix[queue,10m],15m)<{$PROBE.QUEUE.HIGH}'
              name: 'Probe falling behind'
              priority: WARNING
              description: 'Items delayed over 10 minutes stayed at or above the warning threshold for 15 minutes (below the high threshold).'
            - uuid: 424a7f1337554d9085876ef95c243f8c
              expression: 'min(/Argus Probe Health/zabbix[queue,10m],15m)>={$PROBE.QUEUE.HIGH}'
              name: 'Probe badly behind'
              priority: HIGH
              description: 'Items delayed over 10 minutes stayed at or above the high threshold for 15 minutes.'
        - uuid: 3288c751c862498d81a8002c1199d3f5
          name: 'History cache used'
          type: INTERNAL
          key: 'zabbix[wcache,history,pused]'
          delay: 1m
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: '%'
          description: 'How full the proxy history cache is.'
          triggers:
            - uuid: 4649fff6f4a64d62b87261c63ff49cc1
              expression: 'min(/Argus Probe Health/zabbix[wcache,history,pused],5m)>={$PROBE.CACHE.WARN} and min(/Argus Probe Health/zabbix[wcache,history,pused],5m)<{$PROBE.CACHE.HIGH}'
              name: 'Probe history cache filling up'
              priority: WARNING
              description: 'History cache use stayed at or above the warning threshold for 5 minutes (below the high threshold).'
            - uuid: 518672681e3d4c1a82e56032ec983d01
              expression: 'min(/Argus Probe Health/zabbix[wcache,history,pused],5m)>={$PROBE.CACHE.HIGH}'
              name: 'Probe history cache nearly full'
              priority: HIGH
              description: 'History cache use stayed at or above the high threshold for 5 minutes.'
        - uuid: 90a35df04d0a454a9eca6003b4835245
          name: 'Configuration cache used'
          type: INTERNAL
          key: 'zabbix[rcache,buffer,pused]'
          delay: 1m
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: '%'
          description: 'How full the proxy configuration cache is.'
