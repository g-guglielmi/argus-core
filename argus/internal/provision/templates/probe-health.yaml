              name: 'Probe poller processes busy'
              priority: WARNING
              description: 'The poller processes averaged at or above the warning threshold for 5 minutes (below the high threshold).'
            - uuid: 94745521f7cb4f21b2d463f76f772d07
              expression: 'avg(/Argus Probe Health/zabbix[process,poller,avg,busy],5m)>={$PROBE.PROC.HIGH}'
