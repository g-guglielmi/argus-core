        - uuid: d4baff03255946bf8da15601d4da65f0
          name: 'Process load: poller'
          type: INTERNAL
          key: 'zabbix[process,poller,avg,busy]'
          delay: 1m
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: '%'
          description: 'Share of time the proxy poller processes were busy.'
