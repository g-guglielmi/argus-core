              name: 'Probe configuration cache filling up'
              priority: WARNING
              description: 'Configuration cache use stayed at or above the warning threshold for 5 minutes (below the high threshold).'
            - uuid: 4ad38fea6fb84396b71423def821ae5e
              expression: 'min(/Argus Probe Health/zabbix[rcache,buffer,pused],5m)>={$PROBE.CACHE.HIGH}'
              name: 'Probe configuration cache nearly full'
