zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: b0123beba96045ada8542647604ac6ca
      name: Templates/Argus
  templates:
    - uuid: 3851389bf89840ae87625c5d7a6e5dff
      template: 'Argus UniFi Switch by HTTP'
      name: 'Argus UniFi Switch by HTTP'
      description: |
        UniFi switch polled through the UniFi Network Integration API (API key): controller state,
        CPU/memory, uptime, firmware, uplink traffic and per-port link discovery. Works against a
        UniFi OS console (cloud gateway, :443) or a self-hosted console on a custom port - set
        {$UNIFI.URL} to the console base URL including the port, {$UNIFI.KEY} to an API key
        (UniFi Network -> Settings -> Control Plane -> Integrations) and {$UNIFI.MAC} to the
        switch's MAC address. The host's own interface stays the switch IP (Base Ping). DESIGN section 5.
      groups:
        - name: Templates/Argus
      items:
        - uuid: d0f5fcaee12f4e1d995a54293245d740
          name: 'UniFi raw device data'
          type: SCRIPT
          key: unifi.switch.raw
          delay: 1m
          history: '0'
          trends: '0'
          value_type: TEXT
          timeout: 15s
          description: 'Master item: resolves the switch on the controller by MAC and merges its detail + latest statistics into one JSON. Everything else is dependent on this.'
          params: |
            var p = JSON.parse(value);
            if (!p.url || !p.key || !p.mac) { throw 'set {$UNIFI.URL}, {$UNIFI.KEY} and {$UNIFI.MAC} on the host'; }
            var base = p.url.replace(/\/+$/, '') + '/proxy/network/integration/v1';
            function get(path) {
              var req = new HttpRequest();
              req.addHeader('X-API-KEY: ' + p.key);
              req.addHeader('Accept: application/json');
              var resp = req.get(base + path);
              if (req.getStatus() !== 200) { throw 'UniFi API HTTP ' + req.getStatus() + ' for ' + path; }
              return JSON.parse(resp);
            }
            function norm(m) { return String(m || '').toLowerCase().replace(/[^0-9a-f]/g, ''); }
            var sites = get('/sites?limit=200').data || [];
            if (!sites.length) { throw 'UniFi: the API key sees no sites'; }
            var want = String(p.site || 'default').toLowerCase();
            var siteId = sites[0].id;
            for (var i = 0; i < sites.length; i++) {
              if (String(sites[i].name || '').toLowerCase() === want) { siteId = sites[i].id; break; }
            }
            var devices = get('/sites/' + siteId + '/devices?limit=200').data || [];
            var devId = null, mac = norm(p.mac);
            for (var j = 0; j < devices.length; j++) {
              if (norm(devices[j].macAddress) === mac) { devId = devices[j].id; break; }
            }
            if (devId === null) { throw 'UniFi: no device with MAC ' + p.mac + ' on the site'; }
            var detail = get('/sites/' + siteId + '/devices/' + devId);
            var stats = get('/sites/' + siteId + '/devices/' + devId + '/statistics/latest');
            return JSON.stringify({ detail: detail, stats: stats });
          parameters:
            - name: url
              value: '{$UNIFI.URL}'
            - name: key
              value: '{$UNIFI.KEY}'
            - name: mac
              value: '{$UNIFI.MAC}'
            - name: site
              value: '{$UNIFI.SITE}'
        - uuid: 65455f2e8adc4e049e0eff157044ad16
          name: 'Controller state'
          type: DEPENDENT
          key: unifi.device.state
          delay: '0'
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          description: '1 = the controller reports the switch ONLINE (adopted and provisioned), 0 = any other state.'
          master_item:
            key: unifi.switch.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.detail.state'
            - type: JAVASCRIPT
              parameters:
                - 'return value === "ONLINE" ? 1 : 0;'
          triggers:
            - uuid: c1b747b6938b42dea2c759fc6784e1d1
              expression: 'max(/Argus UniFi Switch by HTTP/unifi.device.state,#3)=0'
              name: 'Switch offline on the UniFi controller'
              priority: HIGH
              description: 'The controller has not reported the switch ONLINE on the last 3 checks.'
        - uuid: ca43082bc0b84569be64e7390cadb56c
          name: 'CPU utilization'
          type: DEPENDENT
          key: unifi.cpu.util
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: '%'
          master_item:
            key: unifi.switch.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.stats.cpuUtilizationPct'
          triggers:
            - uuid: 675fe545ec37425cb8fb55280c2f3fee
              expression: 'min(/Argus UniFi Switch by HTTP/unifi.cpu.util,#3)>={$CPU.UTIL.WARN} and min(/Argus UniFi Switch by HTTP/unifi.cpu.util,#3)<{$CPU.UTIL.HIGH}'
              name: 'High CPU utilization'
              priority: WARNING
              description: 'CPU utilization at/above the warning threshold on the last 3 checks.'
            - uuid: b7f3ce5655d549a89e4d5d83b66d52b9
              expression: 'min(/Argus UniFi Switch by HTTP/unifi.cpu.util,#3)>={$CPU.UTIL.HIGH}'
              name: 'Very high CPU utilization'
              priority: HIGH
              description: 'CPU utilization at/above the high threshold on the last 3 checks.'
        - uuid: 82bfc68c6aa840a890268d55656495ed
          name: 'Memory utilization'
          type: DEPENDENT
          key: unifi.mem.util
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: '%'
          master_item:
            key: unifi.switch.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.stats.memoryUtilizationPct'
          triggers:
            - uuid: 0ae790aff9d44da9b9d58b242bcdef79
              expression: 'min(/Argus UniFi Switch by HTTP/unifi.mem.util,#3)>={$MEM.USED.WARN} and min(/Argus UniFi Switch by HTTP/unifi.mem.util,#3)<{$MEM.USED.HIGH}'
              name: 'High memory utilization'
              priority: WARNING
              description: 'Memory use at/above the warning threshold on the last 3 checks.'
            - uuid: 3bff9eafbf1445cb835ef187d31e0e12
              expression: 'min(/Argus UniFi Switch by HTTP/unifi.mem.util,#3)>={$MEM.USED.HIGH}'
              name: 'Very high memory utilization'
              priority: HIGH
              description: 'Memory use at/above the high threshold on the last 3 checks.'
        - uuid: eda0d878edb34c10a0d9aad89ff27f01
          name: Uptime
          type: DEPENDENT
          key: unifi.uptime
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: uptime
          master_item:
            key: unifi.switch.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.stats.uptimeSec'
        - uuid: 5bd62ec03c0e4aff97f050ac8961126a
          name: 'Firmware version'
          type: DEPENDENT
          key: unifi.firmware
          delay: '0'
          history: 7d
          trends: '0'
          value_type: CHAR
          master_item:
            key: unifi.switch.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.detail.firmwareVersion'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
        - uuid: 3d17eb90d5214e07b74619827ebc376d
          name: 'Uplink traffic in'
          type: DEPENDENT
          key: unifi.uplink.in
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: bps
          description: 'Uplink receive rate as reported by the controller. Discarded when the controller sends no uplink block (e.g. right after adoption).'
          master_item:
            key: unifi.switch.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.stats.uplink.rxRateBps'
              error_handler: DISCARD_VALUE
        - uuid: 2188a1d388804b44a47ce668f3c879e3
          name: 'Uplink traffic out'
          type: DEPENDENT
          key: unifi.uplink.out
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: bps
          description: 'Uplink transmit rate as reported by the controller.'
          master_item:
            key: unifi.switch.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.stats.uplink.txRateBps'
              error_handler: DISCARD_VALUE
      discovery_rules:
        - uuid: 939f7f3c014e403a8ed84dacbe0b1872
          name: 'Port discovery'
          type: DEPENDENT
          key: unifi.port.discovery
          delay: '0'
          description: 'Physical switch ports from the controller device detail - only ports that exist.'
          master_item:
            key: unifi.switch.raw
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var ports = (d.detail.interfaces && d.detail.interfaces.ports) || [];
                  var out = [];
                  for (var i = 0; i < ports.length; i++) {
                    out.push({ '{#PORTIDX}': String(ports[i].idx) });
                  }
                  return JSON.stringify(out);
          item_prototypes:
            - uuid: 90a5a13fcb934b5eaa2378d7de6f70ee
              name: 'Port {#PORTIDX} link'
              type: DEPENDENT
              key: 'unifi.port.state[{#PORTIDX}]'
              delay: '0'
              history: 7d
              trends: 365d
              value_type: UNSIGNED
              description: '1 = link up, 0 = link down.'
              master_item:
                key: unifi.switch.raw
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      var ports = (d.detail.interfaces && d.detail.interfaces.ports) || [];
                      for (var i = 0; i < ports.length; i++) {
                        if (String(ports[i].idx) === '{#PORTIDX}') { return ports[i].state === 'UP' ? 1 : 0; }
                      }
                      throw 'port {#PORTIDX} not reported';
            - uuid: 9d532310ce7d442aa0356a921725a310
              name: 'Port {#PORTIDX} speed'
              type: DEPENDENT
              key: 'unifi.port.speed[{#PORTIDX}]'
              delay: '0'
              history: 7d
              trends: 365d
              value_type: FLOAT
              units: bps
              description: 'Negotiated link speed (0 when the port is down).'
              master_item:
                key: unifi.switch.raw
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      var ports = (d.detail.interfaces && d.detail.interfaces.ports) || [];
                      for (var i = 0; i < ports.length; i++) {
                        if (String(ports[i].idx) === '{#PORTIDX}') { return (ports[i].speedMbps || 0) * 1000000; }
                      }
                      throw 'port {#PORTIDX} not reported';
      macros:
        - macro: '{$CPU.UTIL.WARN}'
          value: '80'
          description: 'CPU utilization percentage that raises a warning.'
        - macro: '{$CPU.UTIL.HIGH}'
          value: '95'
          description: 'CPU utilization percentage that raises a high-severity alert.'
        - macro: '{$MEM.USED.WARN}'
          value: '85'
          description: 'Memory-used percentage that raises a warning.'
        - macro: '{$MEM.USED.HIGH}'
          value: '95'
          description: 'Memory-used percentage that raises a high-severity alert.'
        - macro: '{$UNIFI.URL}'
          value: 'https://unifi.example.lan'
          description: 'UniFi console base URL including the port (cloud gateway :443, self-hosted console e.g. :11443). Set per host.'
        - macro: '{$UNIFI.KEY}'
          value: ''
          description: 'UniFi Network API key (Settings -> Control Plane -> Integrations). Set per host as a secret macro.'
        - macro: '{$UNIFI.MAC}'
          value: ''
          description: 'MAC address of the switch this host represents. Set per host.'
        - macro: '{$UNIFI.SITE}'
          value: 'Default'
          description: 'UniFi site name on the controller (the first site is used when no name matches).'
