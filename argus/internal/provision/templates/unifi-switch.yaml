zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: b0123beba96045ada8542647604ac6ca
      name: Templates/Argus
  templates:
    - uuid: 3851389bf89840ae87625c5d7a6e5dff
      template: 'Argus UniFi Switch by HTTP'
      name: 'Argus UniFi Switch by HTTP'
      description: |
        UniFi switch polled from its controller with an API key (one request per poll, addressed by
        MAC): state, CPU/memory, uptime, firmware, temperature (models that report it), uplink
        traffic, total PoE draw, and per-port discovery - link, speed, traffic in/out, and PoE power
        on PoE-capable ports. Works against a UniFi OS console (cloud gateway, :443) or a self-hosted
        console on a custom port: set {$UNIFI.URL} to the console base URL including the port,
        {$UNIFI.KEY} to an API key (UniFi Network -> Settings -> Control Plane -> Integrations) and
        {$UNIFI.MAC} to the switch's MAC. {$UNIFI.SITE} is the site's internal short name (the first
        site is "default"). The host's own interface stays the switch IP (Base Ping). DESIGN section 5.
      groups:
        - name: Templates/Argus
      items:
        - uuid: d0f5fcaee12f4e1d995a54293245d740
          name: 'UniFi raw device data'
          type: SCRIPT
          key: unifi.switch.raw
          delay: 1m
          history: '0'
          trends: '0'
          value_type: TEXT
          timeout: 15s
          description: 'Master item: one controller call for the switch (stat/device by MAC), trimmed to the fields the sensors use. Everything else is dependent on this.'
          params: |
            var p = JSON.parse(value);
            if (!p.url || !p.key || !p.mac) { throw 'set {$UNIFI.URL}, {$UNIFI.KEY} and {$UNIFI.MAC} on the host'; }
            var mac = String(p.mac).toLowerCase().replace(/[^0-9a-f]/g, '');
            if (mac.length !== 12) { throw 'MAC address looks wrong: ' + p.mac; }
            mac = mac.match(/../g).join(':');
            var site = String(p.site || 'default').toLowerCase();
            var req = new HttpRequest();
            req.addHeader('X-API-KEY: ' + p.key);
            req.addHeader('Accept: application/json');
            var resp = req.get(String(p.url).replace(/\/+$/, '') + '/proxy/network/api/s/' + site + '/stat/device/' + mac);
            if (req.getStatus() !== 200) { throw 'UniFi API HTTP ' + req.getStatus(); }
            var body = JSON.parse(resp);
            var d = (body.data && body.data[0]) || null;
            if (!d) { throw 'UniFi: device ' + mac + ' not found on site "' + site + '"'; }
            var ss = d['system-stats'] || {};
            var out = {
              state: d.state,
              model: d.model || '',
              version: d.version || d.displayable_version || '',
              uptime: d.uptime || 0,
              cpu: parseFloat(ss.cpu),
              mem: parseFloat(ss.mem),
              ports: []
            };
            if (typeof d.general_temperature === 'number' && d.general_temperature > 0) { out.temp = d.general_temperature; }
            if (d.uplink) {
              out.uplink_rx_bps = (d.uplink['rx_bytes-r'] || 0) * 8;
              out.uplink_tx_bps = (d.uplink['tx_bytes-r'] || 0) * 8;
            }
            var pt = d.port_table || [];
            var poeTotal = 0, hasPoe = false;
            for (var i = 0; i < pt.length; i++) {
              var q = pt[i];
              var w = parseFloat(q.poe_power || '0') || 0;
              poeTotal += w;
              if (q.port_poe) { hasPoe = true; }
              out.ports.push({
                idx: q.port_idx,
                name: q.name || ('Port ' + q.port_idx),
                up: q.up ? 1 : 0,
                speed_bps: (q.speed || 0) * 1000000,
                poe: q.port_poe ? 1 : 0,
                poe_w: w,
                in_bps: (q['rx_bytes-r'] || 0) * 8,
                out_bps: (q['tx_bytes-r'] || 0) * 8
              });
            }
            if (hasPoe) { out.poe_total_w = Math.round(poeTotal * 100) / 100; }
            return JSON.stringify(out);
          parameters:
            - name: url
              value: '{$UNIFI.URL}'
            - name: key
              value: '{$UNIFI.KEY}'
            - name: mac
              value: '{$UNIFI.MAC}'
            - name: site
              value: '{$UNIFI.SITE}'
        - uuid: 65455f2e8adc4e049e0eff157044ad16
          name: 'Controller state'
          type: DEPENDENT
          key: unifi.device.state
          delay: '0'
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          description: '1 = the controller reports the switch connected, 0 = anything else. Not a curated sensor - it exists to drive the offline trigger.'
          master_item:
            key: unifi.switch.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.state'
            - type: JAVASCRIPT
              parameters:
                - 'return String(value) === "1" ? 1 : 0;'
          triggers:
            - uuid: c1b747b6938b42dea2c759fc6784e1d1
              expression: 'max(/Argus UniFi Switch by HTTP/unifi.device.state,#3)=0'
              name: 'Switch offline on the UniFi controller'
              priority: HIGH
              description: 'The controller has not reported the switch connected on the last 3 checks.'
        - uuid: ca43082bc0b84569be64e7390cadb56c
          name: 'CPU utilization'
          type: DEPENDENT
          key: unifi.cpu.util
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: '%'
          master_item:
            key: unifi.switch.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.cpu'
          triggers:
            - uuid: 675fe545ec37425cb8fb55280c2f3fee
              expression: 'min(/Argus UniFi Switch by HTTP/unifi.cpu.util,#3)>={$CPU.UTIL.WARN} and min(/Argus UniFi Switch by HTTP/unifi.cpu.util,#3)<{$CPU.UTIL.HIGH}'
              name: 'High CPU utilization'
              priority: WARNING
              description: 'CPU utilization at/above the warning threshold on the last 3 checks.'
            - uuid: b7f3ce5655d549a89e4d5d83b66d52b9
              expression: 'min(/Argus UniFi Switch by HTTP/unifi.cpu.util,#3)>={$CPU.UTIL.HIGH}'
              name: 'Very high CPU utilization'
              priority: HIGH
              description: 'CPU utilization at/above the high threshold on the last 3 checks.'
        - uuid: 82bfc68c6aa840a890268d55656495ed
          name: 'Memory utilization'
          type: DEPENDENT
          key: unifi.mem.util
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: '%'
          master_item:
            key: unifi.switch.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.mem'
          triggers:
            - uuid: 0ae790aff9d44da9b9d58b242bcdef79
              expression: 'min(/Argus UniFi Switch by HTTP/unifi.mem.util,#3)>={$MEM.USED.WARN} and min(/Argus UniFi Switch by HTTP/unifi.mem.util,#3)<{$MEM.USED.HIGH}'
              name: 'High memory utilization'
              priority: WARNING
              description: 'Memory use at/above the warning threshold on the last 3 checks.'
            - uuid: 3bff9eafbf1445cb835ef187d31e0e12
              expression: 'min(/Argus UniFi Switch by HTTP/unifi.mem.util,#3)>={$MEM.USED.HIGH}'
              name: 'Very high memory utilization'
              priority: HIGH
              description: 'Memory use at/above the high threshold on the last 3 checks.'
        - uuid: eda0d878edb34c10a0d9aad89ff27f01
          name: Uptime
          type: DEPENDENT
          key: unifi.uptime
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: uptime
          master_item:
            key: unifi.switch.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.uptime'
        - uuid: d450d2c0a8d646f5a23decdc55474c9a
          name: Temperature
          type: DEPENDENT
          key: unifi.temp
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: '°C'
          description: 'General temperature; only models that report one deliver a value (others discard).'
          master_item:
            key: unifi.switch.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.temp'
              error_handler: DISCARD_VALUE
        - uuid: ec2b651249f649278724e23c4ca82fc6
          name: 'PoE power draw'
          type: DEPENDENT
          key: unifi.poe.total
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: W
          description: 'Total PoE power currently delivered across all ports. Only emitted for switches with PoE-capable ports (others discard).'
          master_item:
            key: unifi.switch.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.poe_total_w'
              error_handler: DISCARD_VALUE
        - uuid: 5bd62ec03c0e4aff97f050ac8961126a
          name: 'Firmware version'
          type: DEPENDENT
          key: unifi.firmware
          delay: '0'
          history: 7d
          trends: '0'
          value_type: CHAR
          master_item:
            key: unifi.switch.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.version'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
        - uuid: 3d17eb90d5214e07b74619827ebc376d
          name: 'Uplink traffic in'
          type: DEPENDENT
          key: unifi.uplink.in
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: bps
          description: 'Uplink receive rate. Discarded when the controller sends no uplink block.'
          master_item:
            key: unifi.switch.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.uplink_rx_bps'
              error_handler: DISCARD_VALUE
        - uuid: 2188a1d388804b44a47ce668f3c879e3
          name: 'Uplink traffic out'
          type: DEPENDENT
          key: unifi.uplink.out
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: bps
          description: 'Uplink transmit rate.'
          master_item:
            key: unifi.switch.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.uplink_tx_bps'
              error_handler: DISCARD_VALUE
      discovery_rules:
        - uuid: 939f7f3c014e403a8ed84dacbe0b1872
          name: 'Port discovery'
          type: DEPENDENT
          key: unifi.port.discovery
          delay: '0'
          description: 'Physical switch ports from the controller - only ports that exist.'
          master_item:
            key: unifi.switch.raw
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var ports = d.ports || [];
                  var out = [];
                  for (var i = 0; i < ports.length; i++) {
                    out.push({ '{#PORTIDX}': String(ports[i].idx), '{#PORTNAME}': ports[i].name, '{#POE}': String(ports[i].poe) });
                  }
                  return JSON.stringify(out);
          item_prototypes:
            - uuid: 90a5a13fcb934b5eaa2378d7de6f70ee
              name: 'Port {#PORTIDX} link ({#PORTNAME})'
              type: DEPENDENT
              key: 'unifi.port.state[{#PORTIDX}]'
              delay: '0'
              history: 7d
              trends: 365d
              value_type: UNSIGNED
              description: '1 = link up, 0 = link down.'
              master_item:
                key: unifi.switch.raw
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      var ports = d.ports || [];
                      for (var i = 0; i < ports.length; i++) {
                        if (String(ports[i].idx) === '{#PORTIDX}') { return ports[i].up; }
                      }
                      throw 'port {#PORTIDX} not reported';
            - uuid: 9d532310ce7d442aa0356a921725a310
              name: 'Port {#PORTIDX} speed ({#PORTNAME})'
              type: DEPENDENT
              key: 'unifi.port.speed[{#PORTIDX}]'
              delay: '0'
              history: 7d
              trends: 365d
              value_type: FLOAT
              units: bps
              description: 'Negotiated link speed (0 when the port is down).'
              master_item:
                key: unifi.switch.raw
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      var ports = d.ports || [];
                      for (var i = 0; i < ports.length; i++) {
                        if (String(ports[i].idx) === '{#PORTIDX}') { return ports[i].speed_bps; }
                      }
                      throw 'port {#PORTIDX} not reported';
            - uuid: c5bfba230f1b49b39c8567f828ec8369
              name: 'Port {#PORTIDX} traffic in ({#PORTNAME})'
              type: DEPENDENT
              key: 'unifi.port.in[{#PORTIDX}]'
              delay: '0'
              history: 7d
              trends: 365d
              value_type: FLOAT
              units: bps
              description: 'Receive rate on the port (controller-computed).'
              master_item:
                key: unifi.switch.raw
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      var ports = d.ports || [];
                      for (var i = 0; i < ports.length; i++) {
                        if (String(ports[i].idx) === '{#PORTIDX}') { return ports[i].in_bps; }
                      }
                      throw 'port {#PORTIDX} not reported';
            - uuid: 2efbf39f2ee34ae1b0e62d2eaee5a160
              name: 'Port {#PORTIDX} traffic out ({#PORTNAME})'
              type: DEPENDENT
              key: 'unifi.port.out[{#PORTIDX}]'
              delay: '0'
              history: 7d
              trends: 365d
              value_type: FLOAT
              units: bps
              description: 'Transmit rate on the port (controller-computed).'
              master_item:
                key: unifi.switch.raw
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      var ports = d.ports || [];
                      for (var i = 0; i < ports.length; i++) {
                        if (String(ports[i].idx) === '{#PORTIDX}') { return ports[i].out_bps; }
                      }
                      throw 'port {#PORTIDX} not reported';
        - uuid: ba722f38ebf14b30a9d8dc490385f90b
          name: 'PoE port discovery'
          type: DEPENDENT
          key: unifi.poe.discovery
          delay: '0'
          description: 'The subset of ports that are PoE-capable - only those get a PoE power sensor.'
          master_item:
            key: unifi.switch.raw
          filter:
            evaltype: AND
            conditions:
              - macro: '{#POE}'
                value: '^1$'
                operator: MATCHES_REGEX
                formulaid: A
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var ports = d.ports || [];
                  var out = [];
                  for (var i = 0; i < ports.length; i++) {
                    out.push({ '{#PORTIDX}': String(ports[i].idx), '{#PORTNAME}': ports[i].name, '{#POE}': String(ports[i].poe) });
                  }
                  return JSON.stringify(out);
          item_prototypes:
            - uuid: b37e494c1af146baa45f9aa577913dd0
              name: 'Port {#PORTIDX} PoE power ({#PORTNAME})'
              type: DEPENDENT
              key: 'unifi.port.poe[{#PORTIDX}]'
              delay: '0'
              history: 7d
              trends: 365d
              value_type: FLOAT
              units: W
              description: 'PoE power currently delivered on the port (0 when nothing draws).'
              master_item:
                key: unifi.switch.raw
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      var ports = d.ports || [];
                      for (var i = 0; i < ports.length; i++) {
                        if (String(ports[i].idx) === '{#PORTIDX}') { return ports[i].poe_w; }
                      }
                      throw 'port {#PORTIDX} not reported';
      macros:
        - macro: '{$CPU.UTIL.WARN}'
          value: '80'
          description: 'CPU utilization percentage that raises a warning.'
        - macro: '{$CPU.UTIL.HIGH}'
          value: '95'
          description: 'CPU utilization percentage that raises a high-severity alert.'
        - macro: '{$MEM.USED.WARN}'
          value: '85'
          description: 'Memory-used percentage that raises a warning.'
        - macro: '{$MEM.USED.HIGH}'
          value: '95'
          description: 'Memory-used percentage that raises a high-severity alert.'
        - macro: '{$UNIFI.URL}'
          value: 'https://unifi.example.lan'
          description: 'UniFi console base URL including the port (cloud gateway :443, self-hosted console e.g. :11443). Set per host.'
        - macro: '{$UNIFI.KEY}'
          value: ''
          description: 'UniFi Network API key (Settings -> Control Plane -> Integrations). Set per host as a secret macro.'
        - macro: '{$UNIFI.MAC}'
          value: ''
          description: 'MAC address of the switch this host represents. Set per host.'
        - macro: '{$UNIFI.SITE}'
          value: 'default'
          description: "The site's internal short name on the controller (the first site is 'default')."
