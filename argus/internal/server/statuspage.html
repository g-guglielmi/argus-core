<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Argus status</title>
<link rel="icon" id="favicon" href="data:,">
<style>
  /* The Argus dark palette (web/src/theme.css), so the screen reads like the app. */
  :root {
    --bg: #0e1218; --panel: #151b23; --elev: #1b222c; --border: #262f3b;
    --text: #eef2f8; --muted: #b3bfcd; --faint: #8b98a8;
    --ok: #3fa66a; --warn: #e0a53a; --err: #e2564d; --acked: #cf8585; --accent: #2ea8c9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { display: flex; flex-direction: column; font-size: clamp(13px, 0.95vw, 24px); overflow: hidden; }

  header { display: flex; align-items: center; gap: 0.9em; padding: 0.35em 1em; border-bottom: 1px solid var(--border); background: var(--panel); }
  .brand { font-weight: 800; letter-spacing: 0.18em; font-size: 0.72em; color: var(--accent); }
  .pills { display: flex; gap: 0.45em; margin-left: auto; }
  header { min-height: 2.4em; }
  /* Pills are tinted with their state's colour: a soft wash, a thin border and bright text. The one
     shown gets a stronger wash and a full-colour border; one with nothing in it goes neutral grey. */
  .pill { --c: var(--muted); display: inline-flex; align-items: center; gap: 0.45em; padding: 0.22em 0.85em; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 14%, transparent);
    color: var(--c); font: inherit; font-weight: 650; cursor: pointer; font-variant-numeric: tabular-nums;
    transition: background 0.15s, border-color 0.15s; }
  .pill .n { font-weight: 800; }
  .pill.error { --c: var(--err); } .pill.acked { --c: var(--acked); } .pill.warning { --c: var(--warn); }
  .pill.zero { --c: var(--faint); }
  .pill:hover { background: color-mix(in srgb, var(--c) 22%, transparent); }
  .pill.on { background: color-mix(in srgb, var(--c) 28%, transparent); border-color: var(--c); }
  .clock { text-align: right; line-height: 1.1; white-space: nowrap; }
  .clock .time { font-size: 1.05em; font-weight: 700; font-variant-numeric: tabular-nums; }
  .clock .upd { font-size: 0.68em; color: var(--muted); }

  .banner { display: none; padding: 0.3em 1em; background: color-mix(in srgb, var(--err) 22%, var(--panel)); font-weight: 600; font-size: 0.85em; }
  .banner.on { display: block; }

  main { flex: 1; overflow: hidden; position: relative; }
  .list { height: 100%; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead th { position: sticky; top: 0; background: var(--bg); text-align: left; font-size: 0.68em; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--faint); padding: 0.55em 0.8em 0.4em; border-bottom: 1px solid var(--border); }
  tbody td { padding: 0.42em 0.8em; border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
  tbody tr td:first-child { border-left: 0.3em solid var(--muted); }
  tbody tr.error td:first-child { border-left-color: var(--err); }
  tbody tr.warning td:first-child { border-left-color: var(--warn); }
  tbody tr.acked td:first-child { border-left-color: var(--acked); }
  tbody tr.error { background: color-mix(in srgb, var(--err) 7%, transparent); }
  td.host { font-weight: 700; }
  td.site, td.since { color: var(--muted); }
  td.value { font-weight: 700; font-variant-numeric: tabular-nums; }
  td.value .u { color: var(--muted); font-weight: 400; }
  td.value.bad { color: var(--err); font-weight: 600; }
  td.since { text-align: right; font-variant-numeric: tabular-nums; }
  td.sensor .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  td.sensor .why { font-size: 0.8em; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  td.sensor .sev { font-weight: 700; }
  td.sensor .held { font-style: italic; }
  td.trend svg { display: block; width: 100%; height: 1.5em; }
  td.trend .none { color: var(--faint); }
  .stars { letter-spacing: 0.05em; color: var(--faint); white-space: nowrap; }
  .stars .on { color: #e7b416; }
  col.c-host { width: 15%; } col.c-site { width: 14%; } col.c-sensor { width: 29%; } col.c-value { width: 12%; }
  col.c-trend { width: 13%; } col.c-prio { width: 8%; } col.c-since { width: 9%; }

  .calm { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.4em; text-align: center; padding: 1em; }
  .calm .big { font-size: 3.2em; font-weight: 800; color: var(--ok); display: flex; align-items: center; gap: 0.35em; }
  .calm .big::before { content: ""; width: 0.55em; height: 0.55em; border-radius: 50%; background: currentColor; box-shadow: 0 0 0.6em currentColor; }
  .calm .big.neutral { color: var(--muted); } .calm .big.neutral::before { box-shadow: none; }
  .calm .sub { color: var(--muted); font-size: 1.1em; }
  .pager { position: absolute; right: 0.8em; bottom: 0.5em; font-size: 0.72em; color: var(--muted); background: var(--panel);
    border: 1px solid var(--border); border-radius: 999px; padding: 0.15em 0.7em; font-variant-numeric: tabular-nums; }
  .gone { color: var(--muted); font-size: 1.3em; }
  /* Uptime: the page's hosts over 30 days in the header, and the ones under 100% on a calm screen. */
  .upt { text-align: right; line-height: 1.1; white-space: nowrap; }
  .upt .v { font-size: 1.05em; font-weight: 700; font-variant-numeric: tabular-nums; }
  .upt .l { font-size: 0.68em; color: var(--muted); }
  .below { width: auto; min-width: 26em; margin: 1.4em auto 0; border-collapse: collapse; table-layout: auto; font-variant-numeric: tabular-nums; text-align: left; }
  .below caption { color: var(--muted); font-size: 0.85em; padding-bottom: 0.4em; text-align: left; }
  .below th, .below td { padding: 0.25em 1em; border-bottom: 1px solid var(--border); }
  .below th { color: var(--faint); font-size: 0.72em; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
  .below td.n { text-align: right; font-weight: 650; }
  .below td:first-child { border-left: none; }
  .below tr { background: none; }
</style>
</head>
<body>
<header>
  <span class="brand">ARGUS</span>
  <div class="pills" id="pills">
    <button class="pill error zero" data-kind="error" title="Errors"><span class="n">…</span> Errors</button>
    <button class="pill acked zero" data-kind="acked" title="Acknowledged"><span class="n">…</span> Acknowledged</button>
    <button class="pill warning zero" data-kind="warning" title="Warnings"><span class="n">…</span> Warnings</button>
  </div>
  <div class="upt" id="upt" title="Average uptime of the hosts on this page over the last 30 days"></div>
  <div class="clock"><div class="time" id="clock"></div><div class="upd" id="upd"></div></div>
</header>
<div class="banner" id="banner">Connection lost. Showing the last known state, retrying.</div>
<main id="main"><div class="calm"><div class="sub">Loading…</div></div></main>
<script>
(function () {
  var tz, clock24 = true, lastOK = 0, gone = false, data = null, page = 0, pages = 1;
  // Which list to show: the address's #acknowledged / #warnings, else errors. A pill click writes it
  // into the address (Errors, the default, leaves it clean), so a list can be bookmarked and a plain
  // /status always opens on errors.
  var HASH = { error: 'errors', acked: 'acknowledged', warning: 'warnings' };
  function fromHash() {
    var h = location.hash.replace('#', '').toLowerCase();
    for (var k in HASH) { if (HASH[k] === h || k === h) return k; }
    return null;
  }
  var kind = fromHash() || 'error';
  window.addEventListener('hashchange', function () { var k = fromHash() || 'error'; if (k !== kind) setKind(k); });
  var EMPTY = { error: 'All systems operational', warning: 'No warnings', acked: 'Nothing acknowledged' };

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function ago(ts) {
    var s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
    if (s < 60) return s + 's';
    var m = Math.floor(s / 60); if (m < 60) return m + 'm';
    var h = Math.floor(m / 60); if (h < 24) return h + 'h ' + (m % 60) + 'm';
    return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
  }
  function tick() {
    var opts = { hour: '2-digit', minute: '2-digit', hour12: !clock24 }; if (tz) opts.timeZone = tz;
    var c = document.getElementById('clock');
    try { c.textContent = new Date().toLocaleTimeString([], opts); } catch (e) { c.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: !clock24 }); }
    document.getElementById('upd').textContent = lastOK ? 'Updated ' + ago(lastOK) + ' ago' : '';
  }

  // The tab icon says it at a glance: a green check with no errors, a red "!" with any (warnings and
  // acknowledged problems don't change it).
  var lastIcon = null;
  function setFavicon(ok) {
    if (ok === lastIcon) return; lastIcon = ok;
    var svg = ok
      ? '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#3fa66a"/><path d="M9 16.5l4.5 4.5L23 11.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      : '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#e2564d"/><path d="M16 8.5v10" stroke="#fff" stroke-width="3.8" stroke-linecap="round"/><circle cx="16" cy="23.5" r="2.2" fill="#fff"/></svg>';
    document.getElementById('favicon').setAttribute('href', 'data:image/svg+xml,' + encodeURIComponent(svg));
  }

  function setKind(k) {
    kind = k; page = 0;
    try { history.replaceState(null, '', k === 'error' ? location.pathname : '#' + HASH[k]); } catch (e) {}
    render();
  }
  Array.prototype.forEach.call(document.querySelectorAll('.pill'), function (b) {
    if (b.getAttribute('data-kind') === kind) b.classList.add('on');
    b.addEventListener('click', function () { setKind(b.getAttribute('data-kind')); });
  });

  function render() {
    if (!data) return;
    tz = data.timezone || undefined;
    clock24 = data.clock_24h !== false;
    document.title = data.name + ' · Argus status';
    var c = data.counts || {};
    Array.prototype.forEach.call(document.querySelectorAll('.pill'), function (b) {
      var k = b.getAttribute('data-kind');
      b.querySelector('.n').textContent = c[k] || 0;
      b.className = 'pill ' + k + (k === kind ? ' on' : '') + (c[k] ? '' : ' zero');
    });
    setFavicon(!c.error);
    renderUptime(data.uptime);
    var rows = (data.issues || []).filter(function (i) { return i.kind === kind; });
    var main = document.getElementById('main'); main.textContent = '';
    if (!rows.length) {
      var calm = el('div', 'calm');
      calm.appendChild(el('div', 'big' + (kind === 'error' ? '' : ' neutral'), EMPTY[kind]));
      calm.appendChild(el('div', 'sub', (c.hosts || 0) + (c.hosts === 1 ? ' host monitored' : ' hosts monitored')));
      var below = belowTable(data.uptime);
      if (below) calm.appendChild(below);
      main.appendChild(calm);
      pages = 1; return;
    }
    var list = el('div', 'list'), table = el('table'), cg = el('colgroup');
    ['host', 'site', 'sensor', 'value', 'trend', 'prio', 'since'].forEach(function (n) { var col = el('col'); col.className = 'c-' + n; cg.appendChild(col); });
    table.appendChild(cg);
    var thead = el('thead'), hr = el('tr');
    ['Host', 'Site', 'Sensor', 'Value', 'Trend', 'Priority', 'Since'].forEach(function (h) { var th = el('th', null, h); if (h === 'Since') th.style.textAlign = 'right'; hr.appendChild(th); });
    thead.appendChild(hr); table.appendChild(thead);
    var tb = el('tbody');
    rows.forEach(function (i) {
      var tr = el('tr', i.kind);
      tr.appendChild(el('td', 'host', i.host));
      tr.appendChild(el('td', 'site', i.site));
      var sc = el('td', 'sensor');
      sc.appendChild(el('div', 'nm', i.sensor));
      if (i.reason || i.holds) {
        var why = el('div', 'why'), sv = sevInfo(i.severity);
        if (i.reason) {
          var tag = el('span', 'sev', sv.label); tag.style.color = sv.color;
          why.appendChild(tag); why.appendChild(document.createTextNode(' · ' + i.reason));
        }
        // A master that is down: the sensors it takes down with it are this one row, not rows of their own.
        if (i.holds) why.appendChild(el('span', 'held', (i.reason ? ' · ' : '') + 'holding ' + i.holds + (i.holds === 1 ? ' other sensor' : ' other sensors')));
        sc.appendChild(why);
      }
      tr.appendChild(sc);
      tr.appendChild(valueCell(i.value || ''));
      var tc = el('td', 'trend');
      tc.appendChild(spark(i.spark, i.kind === 'warning' ? 'var(--warn)' : i.kind === 'acked' ? 'var(--acked)' : 'var(--err)', i.units));
      tr.appendChild(tc);
      var pc = el('td'); pc.appendChild(stars(i.priority || 3)); tr.appendChild(pc);
      tr.appendChild(el('td', 'since', i.since ? ago(i.since) : ''));
      tb.appendChild(tr);
    });
    table.appendChild(tb); list.appendChild(table); main.appendChild(list);
    paginate(list);
  }

  // Uptime never rounds up to 100%: one missed check in a month still reads 99.99%.
  function fmtUptime(v) {
    if (v === null || v === undefined) return '-';
    if (v >= 100) return '100%';
    return String(parseFloat((Math.floor(v * 100) / 100).toFixed(2))) + '%';
  }
  function uptimeColor(v) {
    if (v === null || v === undefined) return 'var(--faint)';
    return v >= 99.9 ? 'var(--ok)' : v >= 99 ? 'var(--warn)' : 'var(--err)';
  }
  function renderUptime(u) {
    var box = document.getElementById('upt'); box.textContent = '';
    if (!u || u.overall_30d === null || u.overall_30d === undefined) return;
    var v = el('div', 'v', fmtUptime(u.overall_30d)); v.style.color = uptimeColor(u.overall_30d);
    box.appendChild(v); box.appendChild(el('div', 'l', 'uptime, 30 days'));
  }
  // The hosts under 100% over 30 days, worst first (the server sends at most ten).
  function belowTable(u) {
    if (!u || !u.below || !u.below.length) return null;
    var t = el('table', 'below');
    t.appendChild(el('caption', null, 'Under 100% in the last 30 days'));
    var hr = el('tr');
    ['Host', 'Site', '7 days', '30 days'].forEach(function (h, i) { var th = el('th', null, h); if (i > 1) th.style.textAlign = 'right'; hr.appendChild(th); });
    var th = el('thead'); th.appendChild(hr); t.appendChild(th);
    var tb = el('tbody');
    u.below.forEach(function (h) {
      var tr = el('tr');
      tr.appendChild(el('td', null, h.host)); tr.appendChild(el('td', null, h.site));
      [h.uptime_7d, h.uptime_30d].forEach(function (x) { var td = el('td', 'n', fmtUptime(x)); td.style.color = uptimeColor(x); tr.appendChild(td); });
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    return t;
  }

  // Severity labels and colours, as in the app.
  function sevInfo(n) {
    return [{ label: 'Not classified', color: 'var(--faint)' }, { label: 'Information', color: 'var(--accent)' }, { label: 'Warning', color: 'var(--warn)' },
      { label: 'Average', color: '#f08a4b' }, { label: 'High', color: 'var(--err)' }, { label: 'Disaster', color: '#ff4d4d' }][n] || { label: '', color: 'var(--muted)' };
  }
  // The reading, with its unit dimmed ("86.44 %"); "not supported" in red.
  function valueCell(v) {
    var td = el('td', 'value' + (v === 'not supported' ? ' bad' : ''));
    var m = /^(-?[0-9.,]+)\s+(.+)$/.exec(v);
    if (m) { td.appendChild(document.createTextNode(m[1])); td.appendChild(el('span', 'u', ' ' + m[2])); } else td.textContent = v;
    return td;
  }
  function stars(n) {
    var s = el('span', 'stars'); s.title = 'Priority ' + n + ' of 5';
    for (var k = 1; k <= 5; k++) s.appendChild(el('span', k <= n ? 'on' : null, '★'));
    return s;
  }
  // The same mini graph as the app's lists: a near-flat series draws flat (a minimum span around its
  // middle; percentages keep at least 10 points inside 0-100).
  function spark(vals, color, units) {
    if (!vals || vals.length < 2) return el('span', 'none', '-');
    var w = 168, h = 20, min = vals[0], max = vals[0];
    vals.forEach(function (v) { if (v < min) min = v; if (v > max) max = v; });
    var mid = (min + max) / 2, rng = Math.max(max - min, Math.max(Math.abs(min), Math.abs(max), 1e-9) * 0.1);
    if (units === '%' && max - min < 10) { rng = 10; mid = Math.min(Math.max(mid, 5), 95); }
    var px = function (i) { return (i / (vals.length - 1)) * (w - 2) + 1; };
    var py = function (v) { return h - 2.5 - (((v - mid) / rng) + 0.5) * (h - 4); };
    var d = '';
    vals.forEach(function (v, i) { d += (i ? 'L' : 'M') + px(i).toFixed(1) + ' ' + py(v).toFixed(1) + ' '; });
    var NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h); svg.setAttribute('preserveAspectRatio', 'none');
    var area = document.createElementNS(NS, 'path');
    area.setAttribute('d', 'M1 ' + (h - 1) + ' ' + d.replace('M', 'L').trim() + ' L' + (w - 1) + ' ' + (h - 1) + ' Z');
    area.setAttribute('fill', color); area.setAttribute('opacity', '0.13');
    var line = document.createElementNS(NS, 'path');
    line.setAttribute('d', d.trim()); line.setAttribute('fill', 'none'); line.setAttribute('stroke', color); line.setAttribute('stroke-width', '1.5');
    line.setAttribute('vector-effect', 'non-scaling-stroke');
    svg.appendChild(area); svg.appendChild(line);
    return svg;
  }

  // A TV can't scroll: when the list is taller than the screen, show it a page at a time.
  function paginate(list) {
    var head = list.querySelector('thead'), body = list.querySelectorAll('tbody tr');
    var room = list.clientHeight - (head ? head.offsetHeight : 0);
    var rowH = body.length ? body[0].offsetHeight : 1;
    var per = Math.max(1, Math.floor(room / rowH));
    pages = Math.max(1, Math.ceil(body.length / per));
    if (page >= pages) page = 0;
    Array.prototype.forEach.call(body, function (tr, idx) { tr.style.display = (idx >= page * per && idx < (page + 1) * per) ? '' : 'none'; });
    if (pages > 1) document.getElementById('main').appendChild(el('div', 'pager', (page + 1) + ' / ' + pages));
  }

  function load() {
    if (gone) return;
    fetch('/status/data', { credentials: 'same-origin', cache: 'no-store' }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, code: r.status, j: j }; });
    }).then(function (res) {
      if (res.ok) { data = res.j; lastOK = Math.floor(Date.now() / 1000); document.getElementById('banner').className = 'banner'; render(); tick(); return; }
      if (res.code === 403 || res.code === 404 || res.code === 410) {
        gone = true; var main = document.getElementById('main'); main.textContent = '';
        var calm = el('div', 'calm'); calm.appendChild(el('div', 'gone', (res.j && res.j.error) || 'This status page is no longer available.')); main.appendChild(calm);
        document.getElementById('pills').hidden = true; return;
      }
      throw new Error('status ' + res.code);
    }).catch(function () { document.getElementById('banner').className = 'banner on'; });
  }
  load(); tick();
  setInterval(load, 30000); setInterval(tick, 1000);
  setInterval(function () { if (pages > 1) { page = (page + 1) % pages; render(); } }, 15000);
  window.addEventListener('resize', function () { render(); });
  setTimeout(function () { location.reload(); }, 6 * 3600 * 1000); // pick up a new Argus version now and then
})();
</script>
</body>
</html>
