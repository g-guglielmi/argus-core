name: probe-base-watch

# Keeps the self-enrolling argus-probe image in step with upstream Zabbix, with no manual pushes.
#
# Docker Hub offers no push webhook a third party can subscribe to (only the repo owner can), so
# this polls the base tag on a schedule — but it is change-driven, not a blind rebuild:
#   * REBUILD when the base image DIGEST moves  -> :latest absorbs even same-version Alpine/security
#     rebuilds of zabbix/zabbix-proxy-sqlite3:alpine-7.0-latest.
#   * RELEASE (git tag probe/vX.Y.Z + GitHub Release notes) only when the Zabbix VERSION NUMBER
#     changes (7.0.14 -> 7.0.15) — i.e. only when there is genuinely a new upstream version.
# The last-built (digest, version) is recorded in deploy/probe-image/.zabbix-base, committed by the
# bot with [skip ci] so it never retriggers the main build. Idle days do one cheap manifest lookup.
#
# Moving to a new Zabbix MAJOR.MINOR (7.2, next LTS 8.0, ...) stays manual: bump the FROM tag in
# deploy/probe-image/Dockerfile in lockstep with upgrading the Zabbix SERVER.

on:
  schedule:
    - cron: '17 6 * * *'   # daily ~06:17 UTC; an LTS patch line rarely moves faster
  workflow_dispatch:        # "Run workflow" button forces an immediate check/rebuild

permissions:
  contents: write   # commit the lockfile, push the probe/v* tag, publish the Release
  packages: write   # push the image to GHCR

concurrency:
  group: probe-base-watch
  cancel-in-progress: false

env:
  BASE_IMAGE: zabbix/zabbix-proxy-sqlite3:alpine-7.0-latest
  LOCK_FILE: deploy/probe-image/.zabbix-base

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full tags so the probe/v* existence check is accurate

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cheap, no-pull manifest lookup: the multi-arch index digest uniquely identifies the base.
      - name: Resolve upstream base digest
        id: base
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{.Manifest.Digest}}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Upstream base digest: $DIGEST"

      - name: Read last-built state
        id: last
        run: |
          set -euo pipefail
          if [ -f "$LOCK_FILE" ]; then
            echo "digest=$(sed -n 's/^digest=//p' "$LOCK_FILE")" >> "$GITHUB_OUTPUT"
            echo "version=$(sed -n 's/^version=//p' "$LOCK_FILE")" >> "$GITHUB_OUTPUT"
          else
            echo "digest=" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to rebuild
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ steps.base.outputs.digest }}" = "${{ steps.last.outputs.digest }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No base change — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Base changed — will rebuild."
          fi

      # Only pulls/runs the base when something actually changed.
      - name: Resolve Zabbix version
        id: ver
        if: steps.decide.outputs.changed == 'true'
        run: |
          set -uo pipefail
          # Capture the full -V output (tolerate a non-zero exit); grep -m1 self-terminates so no
          # SIGPIPE from an early-closing `head` under pipefail.
          RAW=$(docker run --rm --entrypoint /usr/sbin/zabbix_proxy "$BASE_IMAGE" -V 2>&1 || true)
          echo "----- zabbix_proxy -V -----"; printf '%s\n' "$RAW"; echo "---------------------------"
          VER=$(printf '%s\n' "$RAW" | grep -m1 -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -z "$VER" ]; then echo "Could not parse Zabbix version (see output above)" >&2; exit 1; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ "$VER" != "${{ steps.last.outputs.version }}" ]; then
            echo "newversion=true" >> "$GITHUB_OUTPUT"
          else
            echo "newversion=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Zabbix version: $VER (previous: ${{ steps.last.outputs.version }})"

      - name: Build & push argus-probe
        if: steps.decide.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/probe-image
          file: ./deploy/probe-image/Dockerfile
          pull: true          # re-resolve the freshest base at build time
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/argus-probe:latest
            ghcr.io/${{ github.repository_owner }}/argus-probe:zabbix-${{ steps.ver.outputs.version }}
          labels: |
            org.opencontainers.image.base.name=${{ env.BASE_IMAGE }}
            io.argus.zabbix.version=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Record the new state (always, when changed) and cut a Release only on a new version number.
      - name: Record state & release
        if: steps.decide.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VER: ${{ steps.ver.outputs.version }}
          PREV_VER: ${{ steps.last.outputs.version }}
          NEW_DIGEST: ${{ steps.base.outputs.digest }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          printf 'digest=%s\nversion=%s\n' "$NEW_DIGEST" "$NEW_VER" > "$LOCK_FILE"
          git add "$LOCK_FILE"
          git commit -m "ci(probe): track Zabbix base $NEW_VER [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

          if [ "${{ steps.ver.outputs.newversion }}" != "true" ]; then
            echo "Same Zabbix version ($NEW_VER) — rebuilt :latest for a base refresh, no Release."
            exit 0
          fi

          TAG="probe/v${NEW_VER}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists — skipping Release."
            exit 0
          fi

          OWNER='${{ github.repository_owner }}'
          {
            echo "Automated rebuild — the upstream **Zabbix proxy** base image published a new version."
            echo
            echo "- **Zabbix:** ${PREV_VER:-(initial)} → **${NEW_VER}**"
            echo "- **Base image:** \`${BASE_IMAGE}\`"
            echo "- **Base digest:** \`${NEW_DIGEST}\`"
            echo "- Upstream release notes: https://www.zabbix.com/rn/rn${NEW_VER}"
            echo "- No Argus code changed — the \`argus\` app image is unaffected."
            echo
            echo "**Pull:**"
            echo '```bash'
            echo "docker pull ghcr.io/${OWNER}/argus-probe:latest   # or pin ghcr.io/${OWNER}/argus-probe:zabbix-${NEW_VER}"
            echo '```'
            echo
            echo "Probe hosts on Watchtower / unRAID auto-update; manual hosts, see \`deploy/README.md\`."
          } > notes.md

          git tag -a "$TAG" -m "argus-probe: Zabbix ${NEW_VER}"
          git push origin "$TAG"
          gh release create "$TAG" --title "argus-probe — Zabbix ${NEW_VER}" --notes-file notes.md
