name: scan

# A standing watch, not a gate: every push already runs govulncheck and npm audit (build.yml), but
# an advisory published after the last push would otherwise wait for the next one. This runs the
# same checks on a schedule, scans the three PUBLISHED images (core, probe, updater) with Trivy
# for known vulnerabilities in what they carry (the OS packages of the probe's and the updater's
# Alpine base and the core's distroless base, the Go binary's modules, the probe's Zabbix build),
# and reads the three REPOSITORIES with Trivy for misconfigurations in what the images are built
# from (the Dockerfiles first) and for secrets committed by mistake. A failed run is the alert
# (GitHub mails the owner); nothing is published or changed here. CodeQL (default setup, in each
# repository's settings) and Dependabot (alerts, security updates, the weekly version bumps) are
# the other standing watches; they report through GitHub's own alerts, not this run.

on:
  schedule:
    - cron: '23 5 * * 1'   # Mondays 05:23 UTC
  workflow_dispatch:

permissions: {}

jobs:
  code:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Go version of the build image
        id: gover
        run: echo "v=$(sed -n 's/^FROM golang:\([0-9.]*\)-alpine.*/\1/p' argus/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.gover.outputs.v }}
          cache-dependency-path: argus/go.sum
      - name: govulncheck
        working-directory: argus
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: argus/web/package-lock.json
      - name: npm audit (production dependencies)
        working-directory: argus/web
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high

  images:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [argus, argus-probe, argus-updater]
    steps:
      # HIGH and CRITICAL findings with a fix available fail the job; a finding the distribution
      # has not fixed yet is listed but doesn't, or every week would fail on things nobody can act on.
      # The updater's cosign is upstream's own release binary: its Go modules carry advisories that
      # only a new cosign release can fix (v3.1.3 of 2026-08 is the newest), so it is left out of
      # the gate and shown by the informational pass below. Bump COSIGN_VERSION in the updater's
      # Dockerfile when a release lands, then drop the exclusion.
      - name: Trivy on the published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-files: /usr/local/bin/cosign
          exit-code: '1'
      - name: Trivy, the whole picture (informational)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          format: table
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'

  repos:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [argus-core, argus-probe, argus-updater]
    steps:
      # The sibling repositories are public, so the workflow's own token reads them (their default
      # branch); this repository is read at the ref that runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
      # Misconfigurations (Trivy's checks for Dockerfiles and the other formats it knows) and secrets
      # in the checkout. HIGH and CRITICAL fail the job; a deliberate exception is listed in that
      # repository's own .trivyignore with its reason (the probe's and the updater's root user, which
      # each image needs: the probe's entrypoint prepares the volume before the stock entrypoint
      # drops to the zabbix user, the updater holds the Docker socket). Known vulnerabilities in the
      # code's dependencies are the code job's (govulncheck, npm audit) and are not repeated here.
      - name: Trivy on the repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Trivy, the whole picture (informational)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          format: table
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
