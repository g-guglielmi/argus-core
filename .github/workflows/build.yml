name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  # A pull request (Dependabot's, or anyone's) runs the checks job only: the read-only token a
  # pull request gets reaches no secret and pushes no image, so a fork can't use this to publish.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permissions are granted per job: the change detection needs nothing, the image build pushes to
# GHCR, the release step writes the Release.
permissions: {}

# Serialize image builds so two runs never push the rolling tags (:testing/:latest) concurrently.
# When a release is cut the usual way - push main, then push the tag - the main-push run queues first
# and the tag-push run queues second; with a shared group (and no cancellation) they run in that order,
# so the tag build is the LAST writer of :testing and leaves it cleanly stamped vX.Y.Z. Without this,
# the two runs race and the main build can clobber :testing back to a same-commit rebuild with a
# different digest, which used to surface as a phantom "update available" on a just-released box.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'build-image' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skip the image build for docs-only branch pushes. Markdown / LICENSE never change the runtime
  # (the binary embeds web/dist + the provision templates - no markdown), so rebuilding :testing and
  # re-stamping the git-describe version for a docs commit only surfaces a phantom "update available".
  # Release (tag) and manual (workflow_dispatch) builds ALWAYS run; any push touching a non-doc file
  # builds; and it fail-opens (any doubt -> build), so it can never suppress a real image change.
  changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.detect.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need both BEFORE and HEAD to diff a branch push
      - name: Detect non-doc changes
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "reason=tag or manual -> build"; echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$BEFORE" ] || ! git rev-parse -q --verify "$BEFORE^{commit}" >/dev/null 2>&1; then
            echo "reason=no valid base -> build (fail-open)"; echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$SHA")
          printf 'changed files:\n%s\n' "$changed"
          if [ -z "$changed" ]; then
            echo "reason=empty diff -> build (fail-open)"; echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if printf '%s\n' "$changed" | grep -qvE '(\.md$|^LICENSE$)'; then
            echo "reason=non-doc file changed -> build"; echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "reason=docs only -> skip image build"; echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  # Dependency hygiene, gating the image: known vulnerabilities reachable from the Go code
  # (govulncheck) and high-severity advisories in the frontend's production dependencies.
  checks:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact toolchain the image builds with, read from the Dockerfile: govulncheck rates the
      # standard library at the toolchain that runs it, so checking a newer patch than the one that
      # builds would pass a gate the image fails. Bumping the Dockerfile is what moves this.
      - name: Go version of the build image
        id: gover
        run: echo "v=$(sed -n 's/^FROM golang:\([0-9.]*\)-alpine.*/\1/p' argus/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.gover.outputs.v }}
          cache-dependency-path: argus/go.sum
      - name: govulncheck
        working-directory: argus
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      # The Go test suite: the boundary tests (sites, probes, tokens), the store, the renderers.
      - name: go test
        working-directory: argus
        run: go test ./...
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: argus/web/package-lock.json
      - name: npm audit (production dependencies)
        working-directory: argus/web
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
      # The core host's backup tools (argus-backup, argus-restore): real tar and gpg, the core's own
      # commands faked. They ship in the core VM image and the manual install, not in the container.
      - name: host backup tools
        run: python3 deploy/core/host/tests/test_host_scripts.py
      # The HTTP collector (argus_http.py, mirrored in argus-probe) against real local servers.
      - name: HTTP collector
        run: python3 deploy/core/externalscripts/tests/test_argus_http.py
      # The Linux SSH collector's CPU share from two /proc/stat samples (counters that go backwards).
      - name: Linux SSH collector
        run: python3 deploy/core/externalscripts/tests/test_argus_linux_ssh.py
      # The speed test collector (argus_speedtest.py, mirrored in argus-probe): its parsing and limits.
      - name: Speedtest collector
        run: python3 deploy/core/externalscripts/tests/test_argus_speedtest.py
      # The XCP-NG collector (argus_xcpng.py, mirrored in argus-probe): the VM list hosts are placed by.
      - name: XCP-NG collector
        run: python3 deploy/core/externalscripts/tests/test_argus_xcpng.py

  docker:
    permissions:
      contents: read
      packages: write   # push images to GHCR
      id-token: write   # keyless cosign: the signature names this workflow as the signer
    needs: [changes, checks]
    if: needs.changes.outputs.build == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags so `git describe` can name the build

      - name: Compute version
        id: version
        # Match only app release tags (v*), never probe/* (or other) tags - otherwise a recent
        # automated probe bump like probe/v7.0.29-r7 would stamp the core with the probe's version.
        run: echo "value=$(git describe --tags --match 'v*' --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          # Pins the image name to "argus" under your account, regardless of the repo name.
          images: ghcr.io/${{ github.repository_owner }}/argus
          # Channel scheme: pushes to main publish :testing (tip-of-main / staging), while :latest is
          # reserved for actual v* releases (alongside :vX.Y.Z). So production can safely pin :latest
          # and a test box can track :testing, without manual tagging. Every build also gets :sha.
          #
          # A v* release build ALSO refreshes :testing. Right after a release, tip-of-main IS the
          # release commit - but the pre-tag main build stamped :testing as "vPREV-N-g<sha>" (git
          # describe couldn't see the not-yet-created tag). Re-publishing :testing from the tag build
          # (cleanly stamped vX.Y.Z, same commit) stops :testing from looking older than the release it
          # contains; it moves ahead again on the next main push.
          tags: |
            type=raw,value=testing,enable={{is_default_branch}}
            type=raw,value=testing,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./argus
          file: ./argus/Dockerfile
          # The core's collectors ride the image (/collectors) for the argus-updater to install.
          build-contexts: |
            collectors=./deploy/core/externalscripts
          push: true
          provenance: true
          sbom: true
          build-args: |
            ARGUS_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          # Override the OCI version label with our git-describe stamp (metadata-action would set it to
          # the tag, e.g. "testing"), so the running core can read the exact build a rolling tag points
          # to - used to name the target of a :testing self-update.
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keyless signature (Sigstore): the image digest is signed with a short-lived certificate
      # bound to THIS workflow's identity, recorded in the public transparency log. A pull can
      # then prove the image came from this repository's build.yml and not from someone holding a
      # registry token: cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com
      # --certificate-identity-regexp '^https://github.com/<owner>/argus-core/.github/workflows/build.yml@' <image>@<digest>
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/argus@${DIGEST}"

  # The self-enrolling probe image (ghcr.io/<owner>/argus-probe) is built by its OWN workflow
  # (.github/workflows/probe-image.yml), on a different lifecycle: it tracks the upstream Zabbix
  # version and our probe-wrapper edits, and is versioned probe/v<zabbix>-r<n> - decoupled from this
  # app's v* semver. An app release therefore no longer emits an argus-probe image.

  # Publishes a GitHub Release for tag pushes (vX.Y.Z), using the matching CHANGELOG section
  # as the release notes. Runs only if the image build succeeded.
  release:
    permissions:
      contents: write   # publish the Release
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract changelog section for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; print; next }
            flag && $0 ~ "^## \\[" { flag=0 }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "----- release notes -----"; cat RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG section found for ${VERSION}" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Argus ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
