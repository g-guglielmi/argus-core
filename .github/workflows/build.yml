name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # required to publish Releases on tag builds
  packages: write   # required to push images to GHCR

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags so `git describe` can name the build

      - name: Compute version
        id: version
        run: echo "value=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Pins the image name to "argus" under your account, regardless of the repo name.
          images: ghcr.io/${{ github.repository_owner }}/argus
          # Channel scheme: pushes to main publish :testing (tip-of-main / staging), while :latest is
          # reserved for actual v* releases (alongside :vX.Y.Z). So production can safely pin :latest
          # and a test box can track :testing, without manual tagging. Every build also gets :sha.
          tags: |
            type=raw,value=testing,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./argus
          file: ./argus/Dockerfile
          push: true
          build-args: |
            ARGUS_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The self-enrolling probe image (ghcr.io/<owner>/argus-probe) is built by its OWN workflow
  # (.github/workflows/probe-image.yml), on a different lifecycle: it tracks the upstream Zabbix
  # version and our probe-wrapper edits, and is versioned probe/v<zabbix>-r<n> - decoupled from this
  # app's v* semver. An app release therefore no longer emits an argus-probe image.

  # Publishes a GitHub Release for tag pushes (vX.Y.Z), using the matching CHANGELOG section
  # as the release notes. Runs only if the image build succeeded.
  release:
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog section for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; print; next }
            flag && $0 ~ "^## \\[" { flag=0 }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "----- release notes -----"; cat RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG section found for ${VERSION}" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Argus ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
